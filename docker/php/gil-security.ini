; Hardening PHP per backoffice, frontoffice e worker (runtime-base).
; Nessun header X-Powered-By con la versione di PHP.
expose_php = Off
; Cookie di sessione sicuri anche se una sessione parte prima che l'applicazione imposti i
; parametri (Secure lo decide l'applicazione in base a HTTPS/proxy).
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
session.use_only_cookies = 1
