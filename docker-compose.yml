# Hardening runtime: nessuna escalation di privilegi (setuid/setgid), nessuna capability
# (salvo il db), filesystem dei container read-only con tmpfs per le
# sole directory scritte a runtime. backoffice/frontoffice/worker girano come www-data.
#
# Segreti obbligatori: DB_ROOT_PASSWORD, BACKOFFICE_DB_PASSWORD, FRONTOFFICE_DB_PASSWORD,
# APP_ENCRYPTION_KEY, MASTER_TOKEN, FRONTOFFICE_LINK_SIGNING_KEY. Se una manca o e' vuota
# lo stack non parte (`${VAR:?...}`) e l'errore nomina la variabile: vedi .env.example.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

# backoffice/frontoffice: Apache (master compreso) gira come www-data, nessuna capability.
# Porta interna resta 80 (mapping host e URL interni invariati): il sysctl, namespaced nel
# container, abbassa la soglia delle porte privilegiate a 80. Docker >=20.10 la mette gia' a 0,
# altri runtime/host no (prod: bind :80 negato senza, incidente 2026-10-28).
# `user` esplicito anche se l'immagine ha gia' USER www-data.
x-php-runtime: &php-runtime
  user: "www-data"
  read_only: true
  sysctls:
    net.ipv4.ip_unprivileged_port_start: 80

# tmpfs nei servizi PHP con mode=1777 (mai uid=/gid=: Podman li rifiuta, "unknown mount
# option"): /tmp = sessioni PHP, upload, temporanei di
# backup/restore, certificato self-signed con SSL=on (un restore grande occupa RAM finche'
# dura); run/lock di Apache (PID per il reload del watchdog frontoffice); storage/logs e
# storage/tmp dell'app (log anche su stdout/Sentry, persi al riavvio; storage/tmp = stato del
# circuit breaker GovPay, gia' per container).

services:
  # Verifica delle firme cosign delle 3 immagini di ${APP_VERSION} prima di avviarle
  # (VERIFY_IMAGES=true): firmate da docker-publish.yml di questo repo su un tag v* o su main.
  # Se fallisce (firma assente, tag inesistente), backoffice, frontoffice e db restano creati
  # ma non avviati e il deploy da Portainer va in errore: rimettere il tag precedente.
  # Spenta (default), esce subito con successo. Serve HTTPS verso ghcr.io e i servizi
  # Sigstore (tuf-repo-cdn.sigstore.dev, rekor.sigstore.dev). Le ripartenze dei container
  # gia' creati (riavvio host, restart policy) non passano di qui.
  # Le immagini pubblicate prima del primo rilascio firmato NON sono firmate: attivare
  # VERIFY_IMAGES solo dopo averlo installato.
  verify-images:
    <<: *hardening
    # Variante -dev (con shell busybox) per il toggle VERIFY_IMAGES; fissata per digest.
    image: ghcr.io/sigstore/cosign/cosign:v3.1.4-dev@sha256:8af1a2cf9fba903fdfc6bdafdc25f7b13ef34ad722095543ea787fb96f7240c1
    restart: "no"
    read_only: true
    tmpfs:
      - /home/nonroot:mode=1777
    environment:
      VERIFY_IMAGES: ${VERIFY_IMAGES:-false}
      APP_VERSION: ${APP_VERSION:-latest}
    entrypoint: ["/busybox/sh", "-ec"]
    command:
      - |
        if [ "$$VERIFY_IMAGES" != "true" ]; then
          echo "Verifica firme disattivata (VERIFY_IMAGES=$$VERIFY_IMAGES)"
          exit 0
        fi
        R=ghcr.io/comune-di-montesilvano/govpay-interaction-layer
        cosign verify \
          --certificate-identity-regexp '^https://github.com/Comune-di-Montesilvano/GovPay-Interaction-Layer/\.github/workflows/docker-publish\.yml@refs/(tags/v.*|heads/main)$$' \
          --certificate-oidc-issuer https://token.actions.githubusercontent.com \
          "$$R-backoffice:$$APP_VERSION" "$$R-frontoffice:$$APP_VERSION" \
          "$$R-db:$$APP_VERSION" >/dev/null
        echo "Firme verificate: $$APP_VERSION"
    # Rete dello stack: senza, compose creerebbe la rete <progetto>_default solo per lui.
    networks:
      - govpay-network

  backoffice:
    <<: [*hardening, *php-runtime]
    tmpfs:
      - /tmp:mode=1777
      - /var/run/apache2:mode=1777
      - /var/lock/apache2:mode=1777
      - /var/www/html/backoffice/storage/logs:mode=1777
      - /var/www/html/backoffice/storage/tmp:mode=1777
    image: ghcr.io/comune-di-montesilvano/govpay-interaction-layer-backoffice:${APP_VERSION:-latest}
    container_name: gil-backoffice
    ports:
      - "${BACKOFFICE_HTTP_PORT:-8443}:80"
    volumes:
      - cache:/var/www/cache
      - gil_certs:/var/www/certificate
      - gil_images:/var/www/html/public/img
      - gil_backups:/backups
    environment:
      - APP_SUITE=backoffice
      - SSL=${SSL:-off}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-govpay}
      - DB_USER=${BACKOFFICE_DB_USER:-govpay}
      - "DB_PASSWORD=${BACKOFFICE_DB_PASSWORD:?BACKOFFICE_DB_PASSWORD obbligatoria: vedi .env.example}"
      - "DB_PASSWORD_CITTADINI=${FRONTOFFICE_DB_PASSWORD:?FRONTOFFICE_DB_PASSWORD obbligatoria: vedi .env.example}"
      - "APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY obbligatoria: vedi .env.example}"
      - "FRONTOFFICE_LINK_SIGNING_KEY=${FRONTOFFICE_LINK_SIGNING_KEY:?FRONTOFFICE_LINK_SIGNING_KEY obbligatoria: vedi .env.example}"
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-}
      # Token per autenticare le chiamate Bearer
      - "MASTER_TOKEN=${MASTER_TOKEN:?MASTER_TOKEN obbligatoria: vedi .env.example}"
    entrypoint: [ "/usr/local/bin/docker-setup.sh" ]
    restart: unless-stopped
    healthcheck:
      # SSL=on: Apache parla TLS sulla stessa porta 80 (certificato self-signed possibile, -k).
      test: ["CMD-SHELL", "curl -sf http://localhost/health || curl -sfk https://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    # Avvio solo con MariaDB pronta (InnoDB inizializzato): niente errori di connessione
    # al primo avvio o dopo un upgrade dell'immagine db. verify-images: vedi sopra.
    depends_on:
      verify-images:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    networks:
      - govpay-network

  frontoffice:
    <<: [*hardening, *php-runtime]
    tmpfs:
      - /tmp:mode=1777
      - /var/run/apache2:mode=1777
      - /var/lock/apache2:mode=1777
      - /var/www/html/frontoffice/storage/logs:mode=1777
    image: ghcr.io/comune-di-montesilvano/govpay-interaction-layer-frontoffice:${APP_VERSION:-latest}
    container_name: gil-frontoffice
    ports:
      - "${FRONTOFFICE_HTTP_PORT:-8444}:80"
    volumes:
      # gil_certs rimosso: frontoffice sidecar non chiama GovPay direttamente
      - gil_images:/var/www/html/public/img:ro
    environment:
      - APP_SUITE=frontoffice
      - SSL=${SSL:-off}
      # Sidecar: frontoffice chiama backoffice via API interna (Bearer MASTER_TOKEN).
      # Nessuna credenziale GovPay/pagoPA necessaria nel frontoffice.
      - BACKOFFICE_INTERNAL_URL=${BACKOFFICE_INTERNAL_URL:-http://backoffice}
      - "MASTER_TOKEN=${MASTER_TOKEN:?MASTER_TOKEN obbligatoria: vedi .env.example}"
      - "APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY obbligatoria: vedi .env.example}"
      - "FRONTOFFICE_LINK_SIGNING_KEY=${FRONTOFFICE_LINK_SIGNING_KEY:?FRONTOFFICE_LINK_SIGNING_KEY obbligatoria: vedi .env.example}"
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-}
      - FRONTOFFICE_WATCHDOG_INTERVAL=${FRONTOFFICE_WATCHDOG_INTERVAL:-300}
      # DB — solo per lettura config (settings table). Non contiene credenziali GovPay.
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-govpay}
      - DB_USER=${FRONTOFFICE_DB_USER:-govpay_cittadini}
      - "DB_PASSWORD=${FRONTOFFICE_DB_PASSWORD:?FRONTOFFICE_DB_PASSWORD obbligatoria: vedi .env.example}"
      - "DB_PASSWORD_CITTADINI=${FRONTOFFICE_DB_PASSWORD:?FRONTOFFICE_DB_PASSWORD obbligatoria: vedi .env.example}"
    entrypoint: [ "/usr/local/bin/docker-setup.sh" ]
    restart: unless-stopped
    depends_on:
      verify-images:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      backoffice:
        condition: service_healthy
    networks:
      - govpay-network

  # Lavori periodici (ex demoni cron_*.php): Symfony Scheduler + Messenger su MariaDB, stessa
  # immagine del backoffice. UN SOLO worker (niente replicas/scale): il lock per lavoro ha TTL
  # 900 s, inferiore alla durata massima di un giro, e il retry delle pendenze massive non e'
  # atomico. Abilitazione/pausa/esegui ora/log: Backoffice -> Funzioni avanzate -> Cron /
  # Servizi (tabelle gil_jobs*).
  # Immagini vecchie (senza bin/worker): resta fermo in attesa, i demoni girano ancora nel
  # container backoffice via .autostart (nessuna doppia esecuzione). Le immagini nuove non
  # avviano piu' i demoni nel backoffice: al primo avvio il worker importa una sola volta i
  # file daemon-<slug>.autostart dal volume cache (montato in sola lettura).
  # Nessuna porta e nessuna capability: PHP CLI come www-data, filesystem read-only.
  worker:
    <<: *hardening
    image: ghcr.io/comune-di-montesilvano/govpay-interaction-layer-backoffice:${APP_VERSION:-latest}
    user: "www-data"
    read_only: true
    # storage/tmp = circuit breaker GovPay condiviso dai processi figli del worker.
    tmpfs:
      - /tmp:mode=1777
      - /var/www/html/backoffice/storage/logs:mode=1777
      - /var/www/html/backoffice/storage/tmp:mode=1777
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -f /var/www/html/bin/worker ]; then
          exec php /var/www/html/bin/worker gil:worker
        fi
        echo "worker: immagine senza bin/worker, nessuna azione (i demoni girano nel backoffice)"
        trap 'exit 0' TERM INT
        while true; do sleep 3600 & wait $$!; done
    volumes:
      - cache:/var/www/cache:ro
      - gil_certs:/var/www/certificate:ro
    # Allineato all'environment del backoffice (APP_SUITE a parte), senza i segreti che i lavori
    # non leggono: MASTER_TOKEN (solo API interne frontoffice) e DB_PASSWORD_CITTADINI.
    environment:
      - APP_SUITE=worker
      - SSL=${SSL:-off}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-govpay}
      - DB_USER=${BACKOFFICE_DB_USER:-govpay}
      - "DB_PASSWORD=${BACKOFFICE_DB_PASSWORD:?BACKOFFICE_DB_PASSWORD obbligatoria: vedi .env.example}"
      - "APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY obbligatoria: vedi .env.example}"
      - "FRONTOFFICE_LINK_SIGNING_KEY=${FRONTOFFICE_LINK_SIGNING_KEY:?FRONTOFFICE_LINK_SIGNING_KEY obbligatoria: vedi .env.example}"
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-}
    restart: unless-stopped
    # Stop: SIGTERM -> il giro in corso finisce il batch corrente, nessun batch nuovo.
    # L'immagine php:apache dichiara STOPSIGNAL SIGWINCH (stop graceful di Apache), che il
    # worker ignorerebbe: senza questa riga ogni stop/restart attende il kill dopo la grazia.
    stop_signal: SIGTERM
    stop_grace_period: 60s
    # PID 1 e' il worker (o l'attesa delle immagini vecchie): se esce, restart policy.
    healthcheck:
      test: ["CMD-SHELL", "grep -qa -e bin/worker /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Il backoffice applica le migrazioni all'avvio (tabelle gil_jobs, messenger_messages, lock_keys).
    depends_on:
      backoffice:
        condition: service_healthy
    networks:
      - govpay-network

  db:
    <<: *hardening
    # L'entrypoint mariadb parte come root, fa chown della datadir e scende a `mysql` (gosu).
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    # Scrive solo nella datadir (volume), nel socket/PID di /run/mysqld e in /tmp.
    read_only: true
    tmpfs:
      - /run/mysqld:mode=1777
      - /tmp:mode=1777
    image: ghcr.io/comune-di-montesilvano/govpay-interaction-layer-db:${APP_VERSION:-latest}
    container_name: gil-db
    restart: always
    environment:
      - "MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD obbligatoria: vedi .env.example}"
      - MARIADB_USER=${BACKOFFICE_DB_USER:-govpay}
      - "MARIADB_PASSWORD=${BACKOFFICE_DB_PASSWORD:?BACKOFFICE_DB_PASSWORD obbligatoria: vedi .env.example}"
      - MARIADB_DATABASE=${DB_NAME:-govpay}
      - DB_USER_CITTADINI=${FRONTOFFICE_DB_USER:-govpay_cittadini}
      - "DB_PASSWORD_CITTADINI=${FRONTOFFICE_DB_PASSWORD:?FRONTOFFICE_DB_PASSWORD obbligatoria: vedi .env.example}"
      # Opzionale. Vuoto = disattivo; 1 = mariadb-upgrade all'avvio (non serve all'healthcheck).
      - MARIADB_AUTO_UPGRADE=${MARIADB_AUTO_UPGRADE:-}
    volumes:
      - db_data:/var/lib/mysql
    # healthcheck.sh dell'immagine ufficiale mariadb, solo --connect: healthy quando il server
    # vero accetta connessioni TCP (durante l'init gira con skip-networking → errore 2002 →
    # unhealthy). Anche "access denied" conta come connesso, quindi non dipende dall'utente
    # `healthcheck` in /var/lib/mysql/.my-healthcheck.cnf (assente sui volumi vecchi, con
    # credenziali sbagliate dopo un restore): --innodb_initialized li lascerebbe unhealthy per
    # sempre e backoffice/frontoffice non partirebbero.
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      verify-images:
        condition: service_completed_successfully
    networks:
      - govpay-network



networks:
  govpay-network:
    driver: bridge

volumes:
  cache:
  db_data:
  # Archivi di backup — accessibili a backoffice
  gil_backups:
  # Certificati GovPay (mTLS client cert+key) — backoffice (RW) e worker (RO)
  gil_certs:
  # Immagini pubbliche ente (logo, favicon) — RW backoffice, RO frontoffice
  gil_images:
