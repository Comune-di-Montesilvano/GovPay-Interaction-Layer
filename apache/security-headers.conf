# Header di sicurezza e informazioni del server, per backoffice e frontoffice (runtime-base).
# Copiato in /etc/apache2/conf-enabled/ dal Dockerfile.

# Nessuna versione di Apache/OS nell'header Server ne' nelle pagine d'errore.
ServerTokens Prod
ServerSignature Off

<IfModule mod_headers.c>
  Header always set X-Content-Type-Options "nosniff"
  Header always set X-Frame-Options "SAMEORIGIN"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
  # Funzioni del browser mai usate da GIL: negate anche a eventuali script iniettati.
  Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), magnetometer=(), gyroscope=(), accelerometer=(), display-capture=()"
  # Finestra isolata dalle pagine di altre origini aperte da/verso GIL (window.opener).
  Header always set Cross-Origin-Opener-Policy "same-origin"
  # HSTS solo su HTTPS: diretto (SSL=on) o dietro reverse proxy TLS (X-Forwarded-Proto). Su HTTP
  # in chiaro i browser lo ignorano comunque. Niente includeSubDomains/preload: il dominio
  # dell'ente puo' avere altri sottodomini ancora in HTTP.
  Header always set Strict-Transport-Security "max-age=31536000" "expr=%{HTTPS} == 'on' || %{HTTP:X-Forwarded-Proto} == 'https'"
  # X-XSS-Protection non inviato: deprecato, ignorato dai browser moderni (e il vecchio filtro
  # XSS di IE/Chrome era a sua volta sfruttabile).
  Header always unset X-XSS-Protection
  # CSP: tutte le risorse dallo stesso host (asset vendorizzati, font self-hosted). 'unsafe-inline'
  # per script e stili solo perche' i template hanno ancora <script> inline, handler on*= e
  # attributi style: toglierlo richiede prima di spostarli in file .js/.css (o nonce).
  # Niente form-action: il checkout pagoPA arriva con un redirect dopo un POST interno e Chrome
  # applica form-action anche ai redirect. blob: per il download client-side (allegato MBT).
  Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'"
  Header always unset X-Powered-By
</IfModule>
