# CSP del frontoffice (solo immagine runtime-frontoffice, caricato dopo security-headers.conf:
# conf-enabled/zz-frontoffice-csp.conf, stesso header -> sostituisce quello generico).
# script-src senza 'unsafe-inline': nei template nessuno script inline ne' handler on*=, il JS sta
# in frontoffice/public/assets/js/fo/ e i dati arrivano dal blocco JSON di
# frontoffice/templates/partials/fo-data.html.twig. style-src resta 'unsafe-inline' (attributi
# style nei template). Niente form-action: vedi security-headers.conf (redirect al checkout).
<IfModule mod_headers.c>
  Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'"
</IfModule>
