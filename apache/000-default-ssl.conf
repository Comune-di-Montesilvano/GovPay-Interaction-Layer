<VirtualHost *:80>
    ServerName localhost

    # Ora il DocumentRoot punta direttamente alla cartella ricostruita "public"
    DocumentRoot /var/www/html/public

    # Rimuoviamo gli ErrorDocument personalizzati per lasciare la gestione degli errori a Slim
    # (Slim intercetterà 404 e 500 tramite ErrorMiddleware). Eventuali 403 restano di default Apache.

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    <IfDefine SSL_ON>
        SSLEngine on
        # Impostati da docker-setup.sh: /ssl/server.* se forniti e leggibili, altrimenti
        # self-signed generato in /tmp (filesystem del container read-only).
        SSLCertificateFile ${GIL_SSL_CERT}
        SSLCertificateKeyFile ${GIL_SSL_KEY}
    </IfDefine>

    # ----------------------------------------------------------------------
    # BLOCCO DI SICUREZZA: Impedisci l'accesso diretto a cartelle sensibili
    # ----------------------------------------------------------------------

    # Nega l'accesso alla cartella delle dipendenze Composer
    <Directory /var/www/html/vendor>
        Require all denied
    </Directory>


    # ----------------------------------------------------------------------
    # Fine Blocchi di Sicurezza
    # ----------------------------------------------------------------------

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Le regole di rewrite sono demandate al file .htaccess dentro /public
    <Directory /var/www/html/public>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

</VirtualHost>

