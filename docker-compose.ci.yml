services:
  db:
    # Esposto solo su loopback: i test PHPUnit del gruppo `db` (tests/Support/DbTestCase.php)
    # si collegano da host con DB_HOST=127.0.0.1 DB_PORT=3307.
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - type: tmpfs
        target: /var/lib/mysql
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
