name: Compose Compat

# Smoke dello stack col docker-compose.yml della PR e le immagini dell'ultima release v*
# (quelle in produzione). Il deploy rilegge il compose da main ma lascia APP_VERSION fisso:
# un cambio di compose che rompe le immagini gia' rilasciate va fermato qui, non scoperto in
# produzione (incidente 2026-10-28: cap_drop ALL senza NET_BIND_SERVICE, Apache giu').
# Nessuna build: pull da GHCR. scripts/smoke-stack.sh simula anche le porte privilegiate.
on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ORG: comune-di-montesilvano

jobs:
  compose-compat:
    name: compose-compat
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Ultimo tag semver vX.Y.Z → tag immagine X.Y.Z (stessa regola di docker-publish).
      - name: Risolvi ultima release
        id: release
        run: |
          set -euo pipefail
          tag=$(git ls-remote --tags --refs "https://github.com/${GITHUB_REPOSITORY}.git" 'v*' \
            | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          [ -n "$tag" ] || { echo "::error::nessun tag vX.Y.Z"; exit 1; }
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Immagini di release: ${tag#v}"

      # container_name rinominati come nel job smoke di docker-publish.yml.
      - name: Genera docker-compose.smoke.yml
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "services:"
            for img in backoffice frontoffice db; do
              echo "  $img:"
              echo "    image: ghcr.io/$ORG/govpay-interaction-layer-$img:$VERSION"
              echo "    container_name: gil-smoke-$img"
            done
            # Worker e volume-perms con l'immagine backoffice di release: senza override
            # userebbero :latest.
            for svc in worker volume-perms; do
              echo "  $svc:"
              echo "    image: ghcr.io/$ORG/govpay-interaction-layer-backoffice:$VERSION"
            done
          } > docker-compose.smoke.yml
          cat docker-compose.smoke.yml

      # auto: release senza bin/worker -> worker inerte (nessun crash loop, 0 riavvii); release
      # con bin/worker -> worker avviato come nel job smoke di docker-publish.yml.
      - name: Smoke test
        env:
          SMOKE_WORKER: auto
        run: scripts/smoke-stack.sh
