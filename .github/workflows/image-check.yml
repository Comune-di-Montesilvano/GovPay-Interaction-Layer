name: Image Check

# Scan Trivy PRE-merge delle immagini backoffice/frontoffice/db, nella merge queue: la build
# Docker completa gira sul commit temporaneo della coda, cosi' una CVE introdotta da un cambio
# di Dockerfile/dipendenze blocca il merge invece di rompere docker-publish dopo.
# Sulla PR gira solo `placeholder`: crea i check `trivy-image (<img>)` richiesti dal ruleset
# (un job matrice saltato per `if:` a livello di job non crea alcun check e bloccherebbe la
# coda), senza build ne' harden-runner. Un job con harden-runner e tutti gli step saltati
# restava appeso dopo "Cleaning up orphan processes" fino al timeout (gamba db, 2 run su 2).
# workflow_dispatch: debug e misura dei tempi a cache fredda (stessi step della merge queue).
on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  placeholder:
    # Stesso nome del job reale: deve coincidere col required check del ruleset.
    name: trivy-image (${{ matrix.image }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    strategy:
      matrix:
        image: [backoffice, frontoffice, db]
    steps:
      - run: echo "Build e scan Trivy di ${{ matrix.image }} nella merge queue (merge_group)."

  trivy-image:
    # Nome esplicito: deve coincidere col required check del ruleset.
    name: trivy-image (${{ matrix.image }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # Cache di build letta dal registry GHCR (sola lettura, nessun push). La cache GHA
      # (type=gha) usa il token di runtime del runner, non GITHUB_TOKEN: nessun permesso.
      packages: read
    strategy:
      fail-fast: false
      matrix:
        image: [backoffice, frontoffice, db]
        include:
          - image: backoffice
            # Allowlist copiate da docker-publish.yml: build-php per backoffice/frontoffice,
            # build-services per db. Run fallita per "blocked" → aggiungere l'host se legittimo.
            endpoints: >
              github.com:443
              api.github.com:443
              codeload.github.com:443
              release-assets.githubusercontent.com:443
              objects.githubusercontent.com:443
              *.githubapp.com:443
              ghcr.io:443
              pkg-containers.githubusercontent.com:443
              registry-1.docker.io:443
              auth.docker.io:443
              production.cloudfront.docker.com:443
              production.cloudflare.docker.com:443
              docker-images-prod.s3.dualstack.us-east-1.amazonaws.com:443
              mirror.gcr.io:443
              registry.npmjs.org:443
              repo.packagist.org:443
              packagist.org:443
              deb.debian.org:80
              deb.debian.org:443
              check.trivy.dev:443
            context: .
            file: Dockerfile
            target: runtime-backoffice
            cache_from: |
              type=registry,ref=ghcr.io/comune-di-montesilvano/govpay-interaction-layer-php-common-cache:main
              type=gha,scope=php-common
              type=gha,scope=backoffice
              type=registry,ref=ghcr.io/comune-di-montesilvano/govpay-interaction-layer-backoffice-buildcache:main
          - image: frontoffice
            endpoints: >
              github.com:443
              api.github.com:443
              codeload.github.com:443
              release-assets.githubusercontent.com:443
              objects.githubusercontent.com:443
              *.githubapp.com:443
              ghcr.io:443
              pkg-containers.githubusercontent.com:443
              registry-1.docker.io:443
              auth.docker.io:443
              production.cloudfront.docker.com:443
              production.cloudflare.docker.com:443
              docker-images-prod.s3.dualstack.us-east-1.amazonaws.com:443
              mirror.gcr.io:443
              registry.npmjs.org:443
              repo.packagist.org:443
              packagist.org:443
              deb.debian.org:80
              deb.debian.org:443
              check.trivy.dev:443
            context: .
            file: Dockerfile
            target: runtime-frontoffice
            cache_from: |
              type=registry,ref=ghcr.io/comune-di-montesilvano/govpay-interaction-layer-php-common-cache:main
              type=gha,scope=php-common
              type=gha,scope=frontoffice
              type=registry,ref=ghcr.io/comune-di-montesilvano/govpay-interaction-layer-frontoffice-buildcache:main
          - image: db
            endpoints: >
              github.com:443
              api.github.com:443
              release-assets.githubusercontent.com:443
              objects.githubusercontent.com:443
              *.githubapp.com:443
              ghcr.io:443
              pkg-containers.githubusercontent.com:443
              registry-1.docker.io:443
              auth.docker.io:443
              production.cloudfront.docker.com:443
              production.cloudflare.docker.com:443
              docker-images-prod.s3.dualstack.us-east-1.amazonaws.com:443
              mirror.gcr.io:443
              check.trivy.dev:443
              archive.ubuntu.com:80
              security.ubuntu.com:80
              archive.mariadb.org:80
              tuf-repo-cdn.sigstore.dev:443
            context: docker
            file: docker/db/Dockerfile
            target: ''
            cache_from: |
              type=gha,scope=db
              type=registry,ref=ghcr.io/comune-di-montesilvano/govpay-interaction-layer-db-cache:main
    steps:
      # Un solo harden-runner con l'allowlist della matrice: i pre-step delle action girano
      # anche quando lo step ha un `if:` falso, quindi due step condizionali avviavano due
      # agent nello stesso job (job db appeso fino al timeout dopo il cleanup).
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: ${{ matrix.endpoints }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Ora (UTC): invalida il layer apt di runtime-base piu' spesso di docker-publish (chiave
      # giornaliera), cosi' una patch Debian uscita dopo il primo build del giorno entra subito e il
      # gate Trivy in coda non resta bloccato fino a mezzanotte UTC (visto 2026-11-02, linux-libc-dev).
      - name: Resolve apt refresh key
        id: apt
        run: echo "apt_refresh=$(date -u +%FT%H)" >> "$GITHUB_OUTPUT"

      # Solo build locale: nessun push, nessun cache-to (la cache la scrive docker-publish).
      - name: Build (load) · ${{ matrix.image }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          load: true
          push: false
          tags: gil-check-${{ matrix.image }}:local
          provenance: false
          sbom: false
          build-args: |
            GIL_IMAGE_TAG=merge-check
            GIL_VERSION_TYPE=merge-check
            GIL_VERSION_LABEL=merge-check
            GIL_REF_URL=
            GIT_COMMIT_SHA=${{ github.sha }}
            GIL_BUILD_DATE=${{ steps.apt.outputs.apt_refresh }}
            APT_REFRESH=${{ steps.apt.outputs.apt_refresh }}
          cache-from: ${{ matrix.cache_from }}

      # Immagine locale (docker daemon del runner). Output table: nessun upload SARIF qui,
      # il tab Security e' alimentato da docker-publish.yml sulle immagini pubblicate.
      # In merge queue decide lo step differenziale (exit 0 qui); in dispatch resta assoluto.
      - name: Trivy scan · ${{ matrix.image }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: image
          image-ref: gil-check-${{ matrix.image }}:local
          format: table
          severity: CRITICAL,HIGH
          exit-code: ${{ github.event_name == 'merge_group' && '0' || '1' }}
          ignore-unfixed: true
          trivyignores: ${{ github.workspace }}/.trivyignore.yaml

      # Dopo il build: .base non deve finire nel contesto Docker. Serve solo per prendere il
      # gate dalla base (una PR non puo' indebolire il gate che la giudica).
      - name: Checkout base
        if: github.event_name == 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.merge_group.base_sha }}
          path: .base
          persist-credentials: false
          sparse-checkout: scripts/security
          sparse-checkout-cone-mode: false

      # In merge queue il gate e' differenziale rispetto alla `latest` pubblicata (stesso run,
      # stesso DB, come ComunicaPA): una CVE gia' in produzione non blocca le PR, la corregge
      # il rebuild giornaliero (causa "Trivy HIGH/CRITICAL con fix su latest") o l'autofix.
      # Una CVE introdotta dalla PR (Dockerfile, immagine base, dipendenze) blocca.
      - name: Trivy differenziale · ${{ matrix.image }} (nuove rispetto a latest)
        if: github.event_name == 'merge_group'
        env:
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
          LATEST: ghcr.io/comune-di-montesilvano/govpay-interaction-layer-${{ matrix.image }}:latest
          IMAGE: gil-check-${{ matrix.image }}:local
        run: |
          opts=(image --quiet --skip-db-update --scanners vuln --severity "CRITICAL,HIGH"
            --ignore-unfixed --ignorefile .trivyignore.yaml --format json)
          trivy "${opts[@]}" --output "$RUNNER_TEMP/head.json" "$IMAGE"
          if docker pull --quiet "$LATEST" >/dev/null 2>&1; then
            trivy "${opts[@]}" --output "$RUNNER_TEMP/base.json" "$LATEST"
            base=(--base "$RUNNER_TEMP/base.json")
          else
            echo "::warning::$LATEST non disponibile: tutte le vulnerabilita' contano come nuove"
            base=(--base-empty)
          fi
          GATE=.base/scripts/security/diff-gate.mjs; [ -f "$GATE" ] || GATE=scripts/security/diff-gate.mjs
          node "$GATE" --format trivy --head "$RUNNER_TEMP/head.json" "${base[@]}"
