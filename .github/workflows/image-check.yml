name: Image Check

# Scan Trivy PRE-merge delle immagini backoffice/frontoffice/db, nella merge queue: la build
# Docker completa gira sul commit temporaneo della coda, cosi' una CVE introdotta da un cambio
# di Dockerfile/dipendenze blocca il merge invece di rompere docker-publish dopo.
# Sulla PR i job risultano verdi con tutti gli step di build/scan saltati: serve solo a far
# esistere i check `trivy-image (<img>)` richiesti dal ruleset (un job matrice saltato per
# `if:` a livello di job non crea alcun check e bloccherebbe la coda).
# workflow_dispatch: debug e misura dei tempi a cache fredda (stessi step della merge queue).
on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  trivy-image:
    # Nome esplicito: deve coincidere col required check del ruleset.
    name: trivy-image (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # Cache di build letta dal registry GHCR (sola lettura, nessun push).
      packages: read
      # Cache GHA (sola lettura).
      actions: read
    strategy:
      fail-fast: false
      matrix:
        image: [backoffice, frontoffice, db]
        include:
          - image: backoffice
            # Allowlist copiate da docker-publish.yml: build-php per backoffice/frontoffice,
            # build-services per db. Run fallita per "blocked" → aggiungere l'host se legittimo.
            endpoints: >
              github.com:443
              api.github.com:443
              codeload.github.com:443
              release-assets.githubusercontent.com:443
              objects.githubusercontent.com:443
              *.githubapp.com:443
              ghcr.io:443
              pkg-containers.githubusercontent.com:443
              registry-1.docker.io:443
              auth.docker.io:443
              production.cloudfront.docker.com:443
              production.cloudflare.docker.com:443
              mirror.gcr.io:443
              registry.npmjs.org:443
              repo.packagist.org:443
              deb.debian.org:80
              deb.debian.org:443
              check.trivy.dev:443
            context: .
            file: Dockerfile
            target: runtime-backoffice
            cache_from: |
              type=registry,ref=ghcr.io/comune-di-montesilvano/govpay-interaction-layer-php-common-cache:main
              type=gha,scope=php-common
              type=gha,scope=backoffice
              type=registry,ref=ghcr.io/comune-di-montesilvano/govpay-interaction-layer-backoffice-buildcache:main
          - image: frontoffice
            endpoints: >
              github.com:443
              api.github.com:443
              codeload.github.com:443
              release-assets.githubusercontent.com:443
              objects.githubusercontent.com:443
              *.githubapp.com:443
              ghcr.io:443
              pkg-containers.githubusercontent.com:443
              registry-1.docker.io:443
              auth.docker.io:443
              production.cloudfront.docker.com:443
              production.cloudflare.docker.com:443
              mirror.gcr.io:443
              registry.npmjs.org:443
              repo.packagist.org:443
              deb.debian.org:80
              deb.debian.org:443
              check.trivy.dev:443
            context: .
            file: Dockerfile
            target: runtime-frontoffice
            cache_from: |
              type=registry,ref=ghcr.io/comune-di-montesilvano/govpay-interaction-layer-php-common-cache:main
              type=gha,scope=php-common
              type=gha,scope=frontoffice
              type=registry,ref=ghcr.io/comune-di-montesilvano/govpay-interaction-layer-frontoffice-buildcache:main
          - image: db
            endpoints: >
              github.com:443
              api.github.com:443
              release-assets.githubusercontent.com:443
              objects.githubusercontent.com:443
              *.githubapp.com:443
              ghcr.io:443
              pkg-containers.githubusercontent.com:443
              registry-1.docker.io:443
              auth.docker.io:443
              production.cloudfront.docker.com:443
              production.cloudflare.docker.com:443
              mirror.gcr.io:443
              check.trivy.dev:443
              archive.ubuntu.com:80
              security.ubuntu.com:80
              archive.mariadb.org:80
            context: docker
            file: docker/db/Dockerfile
            target: ''
            cache_from: |
              type=gha,scope=db
              type=registry,ref=ghcr.io/comune-di-montesilvano/govpay-interaction-layer-db-cache:main
    steps:
      # Un solo harden-runner con l'allowlist della matrice: i pre-step delle action girano
      # anche quando lo step ha un `if:` falso, quindi due step condizionali avviavano due
      # agent nello stesso job (job db appeso fino al timeout dopo il cleanup).
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: ${{ matrix.endpoints }}

      # Sulla PR (e' solo il segnaposto del check) gli step seguenti sono saltati;
      # merge_group e workflow_dispatch fanno build e scan completi.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name != 'pull_request'
        with:
          persist-credentials: false

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Data del giorno: come docker-publish, invalida il layer apt di runtime-base.
      - name: Resolve apt refresh key
        id: apt
        if: github.event_name != 'pull_request'
        run: echo "apt_refresh=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # Solo build locale: nessun push, nessun cache-to (la cache la scrive docker-publish).
      - name: Build (load) · ${{ matrix.image }}
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          load: true
          push: false
          tags: gil-check-${{ matrix.image }}:local
          provenance: false
          sbom: false
          build-args: |
            GIL_IMAGE_TAG=merge-check
            GIL_VERSION_TYPE=merge-check
            GIL_VERSION_LABEL=merge-check
            GIL_REF_URL=
            GIT_COMMIT_SHA=${{ github.sha }}
            GIL_BUILD_DATE=${{ steps.apt.outputs.apt_refresh }}
            APT_REFRESH=${{ steps.apt.outputs.apt_refresh }}
          cache-from: ${{ matrix.cache_from }}

      # Immagine locale (docker daemon del runner). Output table: nessun upload SARIF qui,
      # il tab Security e' alimentato da docker-publish.yml sulle immagini pubblicate.
      - name: Trivy scan · ${{ matrix.image }}
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: image
          image-ref: gil-check-${{ matrix.image }}:local
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          trivyignores: ${{ github.workspace }}/.trivyignore
