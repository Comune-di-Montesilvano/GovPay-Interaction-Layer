name: Docker Publish

# Pipeline (spec D3): setup (verifica origine + rebuild-check) → build ×3 push per digest,
# nessun tag → Trivy bloccante → SBOM CycloneDX + attestazioni provenance/SBOM + firma cosign
# keyless → smoke test dello stack di produzione con i 3 digest → publish dei tag.
# Nessun tag (1.6.8, 1.6, latest, latest-YYYYMMDD) esiste prima di Trivy + smoke: un'immagine
# che fallisce resta un digest orfano, rimosso da ghcr-cleanup.yml.
# Tag pre-release (vX.Y.Z-rc1, qualsiasi suffisso `-`): stessa pipeline, pubblicano solo il
# proprio tag (1.6.9-rc1), mai latest/X.Y/latest-YYYYMMDD, nessuna GitHub Release.
# Tag vX.Y.Z non pre-release: dopo il publish, job release crea la GitHub Release (se assente)
# e allega SBOM CycloneDX + bundle di provenance di ogni immagine.
# Verifica al deploy: scripts/verify-images.sh <tag>.

on:
  # Rilascio: un tag si crea solo su un commit già su main (PR+required check). Il ruleset
  # release-tags limita CHI crea tag (admin); SU QUALE commit lo verifica il job setup
  # (commit del tag antenato di origin/main, altrimenti la run fallisce).
  push:
    tags: ['v*.*.*']
  # Controllo giornaliero (04:30 UTC, dopo il giro dependabot delle 01:00 Europe/Rome):
  # `latest` (+ `latest-YYYYMMDD`) si ricostruisce SOLO se rebuild-check trova una causa reale
  # (commit su main, pacchetti di sistema aggiornabili, vulnerabilità HIGH/CRITICAL con fix
  # nell'immagine pubblicata — scripts/ci/rebuild-check.sh). Nessuna causa = nessun build e
  # nessun riavvio inutile delle istanze. I tag vX.Y.Z li crea solo il maintainer.
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      rebuild_latest:
        description: "Rebuild di latest da main senza rebuild-check (forzato)"
        type: boolean
        default: false
      dry_run:
        description: "Esegue solo il rebuild-check e ne stampa le cause, senza build (anche da branch)"
        type: boolean
        default: false

# Mai cancel-in-progress: un push a ghcr interrotto a meta' puo' lasciare un digest/manifest
# corrotto o incompleto — run concorrenti sullo stesso ref si accodano invece di accavallarsi.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Permessi minimi a livello di workflow, quelli di scrittura solo nei job che li usano.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  ORG: comune-di-montesilvano
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Resolve version + rebuild-check, outputs condivisi con i job di build ──
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Pull delle immagini latest per rebuild-check.
      packages: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      version_type: ${{ steps.v.outputs.version_type }}
      version_label: ${{ steps.v.outputs.version_label }}
      ref_url: ${{ steps.v.outputs.ref_url }}
      apt_refresh: ${{ steps.apt.outputs.apt_refresh }}
      build_date: ${{ steps.apt.outputs.build_date }}
      auto: ${{ steps.mode.outputs.auto }}
      skip: ${{ inputs.dry_run && 'true' || steps.mode.outputs.skip || steps.check.outputs.skip || 'false' }}
      reason: ${{ steps.check.outputs.reason || steps.mode.outputs.reason }}
      auto_tag: ${{ steps.mode.outputs.auto_tag }}
      prerelease: ${{ steps.mode.outputs.prerelease || 'false' }}
    steps:
      # Traffico in uscita limitato agli host elencati (anche dentro i container avviati dal
      # job). Gli endpoint dell'infrastruttura Actions sono consentiti dall'agent.
      # Run fallita per "blocked" → host nel log del post-step harden-runner o nella pagina
      # insights della run: aggiungerlo qui se legittimo.
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            *.githubapp.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            mirror.gcr.io:443
            check.trivy.dev:443
            deb.debian.org:80
            deb.debian.org:443
            archive.ubuntu.com:80
            security.ubuntu.com:80
            www.php.net:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Storia + tag completi: version-resolver ricava l'ultimo tag vX.Y.Z, rebuild-check
          # conta i commit dopo la revisione di latest.
          fetch-depth: 0
      - name: Resolve build mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          REBUILD_LATEST: ${{ inputs.rebuild_latest }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          auto=false
          skip=""
          reason=""
          prerelease=false
          if [[ "$EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/v* ]]; then
            # Solo semver vX.Y.Z o vX.Y.Z-<pre> (metadata-action type=semver non produrrebbe
            # tag per altri formati e il publish fallirebbe dopo tutta la pipeline).
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::tag $GITHUB_REF_NAME non semver (attesi vX.Y.Z o vX.Y.Z-rc1)"
              exit 1
            fi
            # Verifica origine: il commit del tag deve essere gia' su main (passato da PR e
            # required check). Un tag su un branch qualsiasi non produce immagini.
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::tag $GITHUB_REF_NAME su $GITHUB_SHA: commit non presente su origin/main, rilascio rifiutato"
              exit 1
            fi
            reason="tag $GITHUB_REF_NAME"
            # Pre-release: pipeline completa, ma solo il proprio tag (mai latest ne' X.Y).
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              prerelease=true
              reason="tag $GITHUB_REF_NAME (pre-release)"
            fi
          elif [[ "$EVENT_NAME" == "schedule" ]]; then
            auto=true
          elif [[ "$REBUILD_LATEST" == "true" ]]; then
            auto=true
            reason="rebuild forzato (workflow_dispatch)"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$DRY_RUN" != "true" ]]; then
            # Dispatch senza opzioni: nessun tag da produrre.
            skip=true
            echo "::notice::Nessuna opzione scelta: niente build (rebuild_latest o dry_run)."
          fi
          # Qualunque dispatch che builda (oggi: rebuild_latest) solo da main: da un branch
          # pubblicherebbe codice non passato da PR. Il dry_run non builda: consentito ovunque.
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$DRY_RUN" != "true" && "$skip" != "true" \
                && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::build da workflow_dispatch solo da main (ref: $GITHUB_REF)"
            exit 1
          fi
          {
            echo "auto=$auto"
            echo "skip=$skip"
            echo "reason=$reason"
            echo "auto_tag=latest-$(date -u +%Y%m%d)"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
      # Report Trivy delle immagini latest pubblicate, letti da rebuild-check. Mai bloccanti
      # qui: un'immagine assente o uno scan fallito diventano una causa di rebuild.
      - name: Prepara cartella report Trivy
        if: github.event_name == 'schedule' || inputs.dry_run
        run: mkdir -p trivy-latest
      - name: Trivy latest · backoffice
        if: github.event_name == 'schedule' || inputs.dry_run
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: ghcr.io/${{ env.ORG }}/govpay-interaction-layer-backoffice:latest
          format: json
          output: trivy-latest/backoffice.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 0
          trivyignores: ${{ github.workspace }}/.trivyignore
      - name: Trivy latest · frontoffice
        if: github.event_name == 'schedule' || inputs.dry_run
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: ghcr.io/${{ env.ORG }}/govpay-interaction-layer-frontoffice:latest
          format: json
          output: trivy-latest/frontoffice.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 0
          trivyignores: ${{ github.workspace }}/.trivyignore
      - name: Trivy latest · db
        if: github.event_name == 'schedule' || inputs.dry_run
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: ghcr.io/${{ env.ORG }}/govpay-interaction-layer-db:latest
          format: json
          output: trivy-latest/db.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 0
          trivyignores: ${{ github.workspace }}/.trivyignore
      - name: Rebuild-check
        id: check
        if: github.event_name == 'schedule' || inputs.dry_run
        env:
          ORG: ${{ env.ORG }}
          TRIVY_DIR: trivy-latest
          HEAD_SHA: ${{ github.sha }}
        run: scripts/ci/rebuild-check.sh
      - name: Resolve version info
        id: v
        uses: ./.github/actions/version-resolver
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          auto: ${{ steps.mode.outputs.auto }}
      # Data del giorno: invalida il layer apt di runtime-base a ogni build, altrimenti la cache
      # GHA/registry congela `apt-get upgrade` e le patch Debian non entrano mai.
      - name: Resolve apt refresh key
        id: apt
        run: |
          echo "apt_refresh=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

  # ── Shared PHP base cache warmup ───────────────────────────────────────────
  # Build the common runtime-base layer once so backoffice/frontoffice reuse
  # the expensive asset_builder/vendor_builder/runtime-base graph.
  build-php-base:
    needs: setup
    if: needs.setup.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      # Allowlist dei build: registry immagini base (Docker Hub), BuildKit, apt Debian, npm,
      # composer (packagist + dist GitHub), GHCR per la cache. Vedi commento nel job setup.
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            *.githubapp.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudfront.docker.com:443
            production.cloudflare.docker.com:443
            docker-images-prod.s3.dualstack.us-east-1.amazonaws.com:443
            mirror.gcr.io:443
            registry.npmjs.org:443
            repo.packagist.org:443
            deb.debian.org:80
            deb.debian.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build shared PHP base cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: runtime-base
          push: false
          provenance: false
          sbom: false
          build-args: |
            GIL_IMAGE_TAG=cache-warmup
            GIL_VERSION_TYPE=cache-warmup
            GIL_VERSION_LABEL=cache-warmup
            GIL_REF_URL=
            GIT_COMMIT_SHA=cache-warmup
            APT_REFRESH=${{ needs.setup.outputs.apt_refresh }}
          cache-from: |
            type=registry,ref=ghcr.io/${{ env.ORG }}/govpay-interaction-layer-php-common-cache:main
            type=gha,scope=php-common
          cache-to: |
            type=registry,ref=ghcr.io/${{ env.ORG }}/govpay-interaction-layer-php-common-cache:main,mode=max
            type=gha,mode=max,scope=php-common

  # ── PHP apps: backoffice + frontoffice (parallel matrix) ─────────────────
  # Shared layers are warmed by build-php-base and then reused per app.
  build-php:
    needs: [setup]
    if: needs.setup.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      security-events: write
      # Firma keyless cosign e attestazioni: certificato Sigstore sull'identita' OIDC del workflow.
      id-token: write
      attestations: write
      # Storage record dell'immagine (actions/attest con push-to-registry): senza, warning
      # "Please check that the artifact-metadata:write permission has been included".
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: backoffice
            target: runtime-backoffice
            image_suffix: backoffice
            scope: backoffice
          - app: frontoffice
            target: runtime-frontoffice
            image_suffix: frontoffice
            scope: frontoffice
    steps:
      # Come build-php-base, piu' gli host di Trivy (DB vulnerabilità) e di Sigstore (firma
      # cosign + attestazioni: Fulcio, Rekor e shard Rekor v2 *.rekor, TSA, TUF). Il binario cosign arriva dalle release
      # GitHub (release-assets/objects.githubusercontent.com, gia' presenti).
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            *.githubapp.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudfront.docker.com:443
            production.cloudflare.docker.com:443
            docker-images-prod.s3.dualstack.us-east-1.amazonaws.com:443
            mirror.gcr.io:443
            registry.npmjs.org:443
            repo.packagist.org:443
            deb.debian.org:80
            deb.debian.org:443
            check.trivy.dev:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            *.rekor.sigstore.dev:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Meta · ${{ matrix.app }}
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ env.ORG }}/govpay-interaction-layer-${{ matrix.image_suffix }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            gil.rebuild.reason=${{ needs.setup.outputs.reason }}
          # Tag previsti, NON applicati qui: l'immagine va su GHCR solo per digest e il job
          # publish li applica dopo Trivy, firma e smoke test di TUTTE le immagini.
          # Tag git vX.Y.Z → X.Y.Z, X.Y, latest; rebuild automatico → latest, latest-YYYYMMDD.
          # Pre-release vX.Y.Z-rc1 → solo X.Y.Z-rc1 (type=semver salta {{major}}.{{minor}} sulle
          # pre-release; latest escluso qui e con latest=false, il publish lo ricontrolla).
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ (startsWith(github.ref, 'refs/tags/') && needs.setup.outputs.prerelease != 'true') || needs.setup.outputs.auto == 'true' }}
            type=raw,value=${{ needs.setup.outputs.auto_tag }},enable=${{ needs.setup.outputs.auto == 'true' }}

      - name: Build & push · ${{ matrix.app }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: ${{ matrix.target }}
          # Push solo per digest, senza nessun tag: un'immagine che non passa Trivy o smoke
          # resta un digest orfano (ghcr-cleanup.yml) e non e' mai raggiungibile da un tag.
          outputs: type=image,name=ghcr.io/${{ env.ORG }}/govpay-interaction-layer-${{ matrix.image_suffix }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          # Disabilitati: provenance e SBOM li producono (firmati) gli step attest-* sotto,
          # cosi' non nascono index con manifest figli non taggati.
          provenance: false
          sbom: false
          build-args: |
            GIL_IMAGE_TAG=${{ needs.setup.outputs.version }}
            GIL_VERSION_TYPE=${{ needs.setup.outputs.version_type }}
            GIL_VERSION_LABEL=${{ needs.setup.outputs.version_label }}
            GIL_REF_URL=${{ needs.setup.outputs.ref_url }}
            GIT_COMMIT_SHA=${{ github.sha }}
            GIL_BUILD_DATE=${{ needs.setup.outputs.build_date }}
            APT_REFRESH=${{ needs.setup.outputs.apt_refresh }}
          cache-from: |
            type=registry,ref=ghcr.io/${{ env.ORG }}/govpay-interaction-layer-php-common-cache:main
            type=gha,scope=php-common
            type=gha,scope=${{ matrix.scope }}
            type=registry,ref=ghcr.io/${{ env.ORG }}/govpay-interaction-layer-${{ matrix.image_suffix }}-buildcache:main
          # mode=max protegge cache di composer e npm (stage intermedi); inline aggiunge
          # metadati cache nell'immagine per fallback registry su cache GHA evict
          cache-to: |
            type=registry,ref=ghcr.io/${{ env.ORG }}/govpay-interaction-layer-${{ matrix.image_suffix }}-buildcache:main,mode=max
            type=gha,mode=max,scope=${{ matrix.scope }}
            type=inline

      - name: Trivy scan · ${{ matrix.app }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: ghcr.io/${{ env.ORG }}/govpay-interaction-layer-${{ matrix.image_suffix }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.image_suffix }}.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
          limit-severities-for-sarif: true
          ignore-unfixed: true
          trivyignores: ${{ github.workspace }}/.trivyignore

      # Da qui in poi solo se Trivy (step prima) e' passato.
      # SBOM CycloneDX dell'immagine (stesso Trivy della scansione), attestato sotto.
      - name: SBOM (Trivy) · ${{ matrix.app }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: image
          image-ref: ghcr.io/${{ env.ORG }}/govpay-interaction-layer-${{ matrix.image_suffix }}@${{ steps.build.outputs.digest }}
          format: cyclonedx
          output: sbom-${{ matrix.image_suffix }}.cdx.json
          skip-setup-trivy: true
          trivyignores: ${{ github.workspace }}/.trivyignore

      # Attestazioni firmate (Sigstore) e registrate su GitHub e su GHCR, legate al digest:
      # provenance SLSA (repo, commit, workflow e run che hanno prodotto l'immagine) e SBOM.
      # Verifica: scripts/verify-images.sh.
      - name: Attestazione provenance · ${{ matrix.app }}
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ env.ORG }}/govpay-interaction-layer-${{ matrix.image_suffix }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attestazione SBOM · ${{ matrix.app }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ env.ORG }}/govpay-interaction-layer-${{ matrix.image_suffix }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom-${{ matrix.image_suffix }}.cdx.json
          push-to-registry: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Firma keyless del digest (non del tag, che e' mobile): verificabile al deploy con la
      # sola immagine cosign, senza gh ne' token (scripts/verify-images.sh <tag>).
      - name: Firma immagine (cosign) · ${{ matrix.app }}
        env:
          IMAGE: ghcr.io/${{ env.ORG }}/govpay-interaction-layer-${{ matrix.image_suffix }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      # Digest firmato + tag previsti → job smoke e publish (artifact digest-<img>).
      - name: Salva digest e tag · ${{ matrix.app }}
        env:
          IMG: ${{ matrix.image_suffix }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          mkdir -p handoff
          printf '%s\n' "$DIGEST" > "handoff/$IMG.digest"
          printf '%s\n' "$TAGS" > "handoff/$IMG.tags"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image_suffix }}
          path: handoff/
          retention-days: 1
          if-no-files-found: error

      # Asset della GitHub Release (solo tag vX.Y.Z non pre-release, job release): SBOM
      # CycloneDX e bundle Sigstore della provenance SLSA (una riga JSON, verificabile con
      # `gh attestation verify --bundle`).
      - name: Prepara asset release · ${{ matrix.app }}
        if: startsWith(github.ref, 'refs/tags/v') && needs.setup.outputs.prerelease != 'true'
        env:
          IMG: ${{ matrix.image_suffix }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp "sbom-$IMG.cdx.json" "release-assets/govpay-interaction-layer-$IMG.cdx.json"
          cp "$BUNDLE" "release-assets/govpay-interaction-layer-$IMG.intoto.jsonl"
      - if: startsWith(github.ref, 'refs/tags/v') && needs.setup.outputs.prerelease != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.image_suffix }}
          path: release-assets/
          retention-days: 1
          if-no-files-found: error

      - name: Upload Trivy results · ${{ matrix.app }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        if: always()
        with:
          sarif_file: trivy-${{ matrix.image_suffix }}.sarif
          category: trivy-${{ matrix.image_suffix }}

  # ── Independent services: parallel matrix ─────────────────────────────────
  build-services:
    needs: setup
    if: needs.setup.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      security-events: write
      # Firma keyless cosign e attestazioni: certificato Sigstore sull'identita' OIDC del workflow.
      id-token: write
      attestations: write
      # Storage record dell'immagine (actions/attest con push-to-registry): senza, warning
      # "Please check that the artifact-metadata:write permission has been included".
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: db
            context: docker
            file: docker/db/Dockerfile
            scope: db
            cache_mode: min

    steps:
      # Immagine db: base mariadb (Docker Hub), apt Ubuntu + repo mariadb (HTTP, pacchetti
      # firmati GPG), script init, piu' Trivy, GHCR e Sigstore (firma + attestazioni, shard Rekor v2 *.rekor).
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            *.githubapp.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudfront.docker.com:443
            production.cloudflare.docker.com:443
            docker-images-prod.s3.dualstack.us-east-1.amazonaws.com:443
            mirror.gcr.io:443
            check.trivy.dev:443
            archive.ubuntu.com:80
            security.ubuntu.com:80
            archive.mariadb.org:80
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            *.rekor.sigstore.dev:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Meta · ${{ matrix.image }}
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ env.ORG }}/govpay-interaction-layer-${{ matrix.image }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            gil.rebuild.reason=${{ needs.setup.outputs.reason }}
          # Tag previsti, NON applicati qui: l'immagine va su GHCR solo per digest e il job
          # publish li applica dopo Trivy, firma e smoke test di TUTTE le immagini.
          # Tag git vX.Y.Z → X.Y.Z, X.Y, latest; rebuild automatico → latest, latest-YYYYMMDD.
          # Pre-release vX.Y.Z-rc1 → solo X.Y.Z-rc1 (type=semver salta {{major}}.{{minor}} sulle
          # pre-release; latest escluso qui e con latest=false, il publish lo ricontrolla).
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ (startsWith(github.ref, 'refs/tags/') && needs.setup.outputs.prerelease != 'true') || needs.setup.outputs.auto == 'true' }}
            type=raw,value=${{ needs.setup.outputs.auto_tag }},enable=${{ needs.setup.outputs.auto == 'true' }}

      - name: Build & push · ${{ matrix.image }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file || format('{0}/Dockerfile', matrix.context) }}
          # Push solo per digest, senza nessun tag: un'immagine che non passa Trivy o smoke
          # resta un digest orfano (ghcr-cleanup.yml) e non e' mai raggiungibile da un tag.
          outputs: type=image,name=ghcr.io/${{ env.ORG }}/govpay-interaction-layer-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          # Disabilitati: provenance e SBOM li producono (firmati) gli step attest-* sotto,
          # cosi' non nascono index con manifest figli non taggati.
          provenance: false
          sbom: false
          build-args: |
            GIL_IMAGE_TAG=${{ needs.setup.outputs.version }}
            GIL_VERSION_TYPE=${{ needs.setup.outputs.version_type }}
            GIL_VERSION_LABEL=${{ needs.setup.outputs.version_label }}
            GIL_REF_URL=${{ needs.setup.outputs.ref_url }}
            GIT_COMMIT_SHA=${{ github.sha }}
            GIL_BUILD_DATE=${{ needs.setup.outputs.build_date }}
            APT_REFRESH=${{ needs.setup.outputs.apt_refresh }}
          cache-from: |
            type=gha,scope=${{ matrix.scope }}
            type=registry,ref=ghcr.io/${{ env.ORG }}/govpay-interaction-layer-${{ matrix.image }}-cache:main
          # GHA cache: max per layer costosi (pip/git/curl), min per immagini triviali
          # Registry fallback: sopravvive all'eviction GHA (10GB limit)
          cache-to: |
            type=gha,mode=${{ matrix.cache_mode }},scope=${{ matrix.scope }}
            type=registry,ref=ghcr.io/${{ env.ORG }}/govpay-interaction-layer-${{ matrix.image }}-cache:main,mode=max

      - name: Trivy scan · ${{ matrix.image }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: ghcr.io/${{ env.ORG }}/govpay-interaction-layer-${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
          limit-severities-for-sarif: true
          ignore-unfixed: true
          trivyignores: ${{ github.workspace }}/.trivyignore

      # Da qui in poi solo se Trivy (step prima) e' passato.
      # SBOM CycloneDX dell'immagine (stesso Trivy della scansione), attestato sotto.
      - name: SBOM (Trivy) · ${{ matrix.image }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: image
          image-ref: ghcr.io/${{ env.ORG }}/govpay-interaction-layer-${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: cyclonedx
          output: sbom-${{ matrix.image }}.cdx.json
          skip-setup-trivy: true
          trivyignores: ${{ github.workspace }}/.trivyignore

      # Attestazioni firmate (Sigstore) e registrate su GitHub e su GHCR, legate al digest:
      # provenance SLSA (repo, commit, workflow e run che hanno prodotto l'immagine) e SBOM.
      # Verifica: scripts/verify-images.sh.
      - name: Attestazione provenance · ${{ matrix.image }}
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ env.ORG }}/govpay-interaction-layer-${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attestazione SBOM · ${{ matrix.image }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ env.ORG }}/govpay-interaction-layer-${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom-${{ matrix.image }}.cdx.json
          push-to-registry: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Firma keyless del digest (non del tag, che e' mobile): verificabile al deploy con la
      # sola immagine cosign, senza gh ne' token (scripts/verify-images.sh <tag>).
      - name: Firma immagine (cosign) · ${{ matrix.image }}
        env:
          IMAGE: ghcr.io/${{ env.ORG }}/govpay-interaction-layer-${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      # Digest firmato + tag previsti → job smoke e publish (artifact digest-<img>).
      - name: Salva digest e tag · ${{ matrix.image }}
        env:
          IMG: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          mkdir -p handoff
          printf '%s\n' "$DIGEST" > "handoff/$IMG.digest"
          printf '%s\n' "$TAGS" > "handoff/$IMG.tags"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image }}
          path: handoff/
          retention-days: 1
          if-no-files-found: error

      # Asset della GitHub Release (solo tag vX.Y.Z non pre-release, job release): SBOM
      # CycloneDX e bundle Sigstore della provenance SLSA (una riga JSON, verificabile con
      # `gh attestation verify --bundle`).
      - name: Prepara asset release · ${{ matrix.image }}
        if: startsWith(github.ref, 'refs/tags/v') && needs.setup.outputs.prerelease != 'true'
        env:
          IMG: ${{ matrix.image }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp "sbom-$IMG.cdx.json" "release-assets/govpay-interaction-layer-$IMG.cdx.json"
          cp "$BUNDLE" "release-assets/govpay-interaction-layer-$IMG.intoto.jsonl"
      - if: startsWith(github.ref, 'refs/tags/v') && needs.setup.outputs.prerelease != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.image }}
          path: release-assets/
          retention-days: 1
          if-no-files-found: error

      - name: Upload Trivy results · ${{ matrix.image }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        if: always()
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

  # ── Smoke test: stack di produzione con i 3 digest appena firmati ──────────
  # docker-compose.yml (mai l'override locale, che builda dal sorgente) + un override generato
  # qui che fissa image: …@sha256:… per ogni servizio (APP_VERSION e' una sola variabile per
  # tre immagini). Se fallisce nessun tag si sposta e latest resta il precedente.
  smoke:
    needs: [setup, build-php, build-services]
    if: needs.setup.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      # Solo GHCR: le 3 immagini e quella cosign di verify-images (ghcr.io/sigstore) sono tutte
      # li'; con VERIFY_IMAGES non impostata verify-images esce subito, niente Sigstore.
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: handoff
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # container_name rinominati come in locale (vedi scripts/smoke-stack.sh): stesso file
      # usabile anche su una macchina con lo stack di sviluppo attivo.
      - name: Genera docker-compose.smoke.yml
        env:
          ORG: ${{ env.ORG }}
        run: |
          set -euo pipefail
          {
            echo "services:"
            for img in backoffice frontoffice db; do
              digest=$(cat "handoff/$img.digest")
              [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::digest non valido per $img"; exit 1; }
              echo "  $img:"
              echo "    image: ghcr.io/$ORG/govpay-interaction-layer-$img@$digest"
              echo "    container_name: gil-smoke-$img"
            done
            # Worker e volume-perms: stessa immagine del backoffice, stesso digest (niente
            # container_name nel compose).
            for svc in worker volume-perms; do
              echo "  $svc:"
              echo "    image: ghcr.io/$ORG/govpay-interaction-layer-backoffice@$(cat handoff/backoffice.digest)"
            done
          } > docker-compose.smoke.yml
          cat docker-compose.smoke.yml
      # Immagini appena buildate: bin/worker obbligatorio, worker avviato con marker in gil_jobs.
      - name: Smoke test
        env:
          SMOKE_WORKER: new
        run: scripts/smoke-stack.sh

  # ── Publish: tag su tutte e 3 le immagini insieme, solo dopo Trivy + firma + smoke ─
  # Mai un tag misto tra revisioni (frontoffice usa le API /api/frontoffice/* del backoffice
  # della stessa revisione): si controllano prima tutti i digest, poi si tagga.
  # Tag git vX.Y.Z → X.Y.Z, X.Y, latest; rebuild automatico → latest, latest-YYYYMMDD;
  # pre-release vX.Y.Z-rc1 → solo X.Y.Z-rc1 (liste calcolate da metadata-action nei build).
  # Ordine: prima i tag di versione di tutte e 3, poi latest-YYYYMMDD, `latest` per ultimo,
  # ogni imagetools create con 3 tentativi: un errore prima dell'ultima fase non sposta latest
  # (resta la revisione precedente per tutte e 3); solo un errore persistente durante l'ultima
  # fase puo' lasciare latest misto (rilanciare la run: i tag gia' applicati non cambiano).
  publish:
    needs: [setup, build-php, build-services, smoke]
    if: needs.setup.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: handoff
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Niente setup-buildx: imagetools create lavora solo sul registry.
      - name: Pubblica tag
        env:
          ORG: ${{ env.ORG }}
          PRERELEASE: ${{ needs.setup.outputs.prerelease }}
        run: |
          set -euo pipefail
          imgs=(backoffice frontoffice db)
          # 3 tentativi con pausa crescente (errori transitori del registry). imagetools create
          # sullo stesso digest e' idempotente: ripeterlo non cambia il risultato.
          retry() {
            local n
            for n in 1 2 3; do
              "$@" && return 0
              if [ "$n" -lt 3 ]; then
                echo "tentativo $n/3 fallito, riprovo: $*" >&2
                sleep $((n * 15))
              fi
            done
            echo "3 tentativi falliti: $*" >&2
            return 1
          }
          tag_digest() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -re .digest; }
          # Tag di una fase: version (tutti tranne latest*), dated (latest-YYYYMMDD), latest.
          tags_of() {
            local image="ghcr.io/$ORG/govpay-interaction-layer-$1" t
            while IFS= read -r t; do
              [ -n "$t" ] || continue
              case "$2:${t#"$image:"}" in
                version:latest | version:latest-*) ;;
                version:* | dated:latest-* | latest:latest) echo "$t" ;;
              esac
            done < "handoff/$1.tags"
          }
          # Applica i tag (argomenti dopo immagine e digest) e controlla che ognuno punti al digest.
          apply() {
            local image=$1 digest=$2 t tagged
            shift 2
            [ "$#" -gt 0 ] || return 0
            local args=()
            for t in "$@"; do args+=(-t "$t"); done
            # --prefer-index=false: copia identica del manifest firmato. Di default imagetools
            # create avvolge un manifest singolo in un nuovo index (digest diverso, non firmato).
            retry docker buildx imagetools create --prefer-index=false "${args[@]}" "$image@$digest"
            for t in "$@"; do
              tagged=$(retry tag_digest "$t")
              [ "$tagged" = "$digest" ] || { echo "::error::$t punta a $tagged, non al digest firmato $digest"; exit 1; }
            done
            echo "::notice::$image@$digest → $*"
          }

          # Controlli su tutte e 3 prima di toccare qualunque tag.
          for img in "${imgs[@]}"; do
            image="ghcr.io/$ORG/govpay-interaction-layer-$img"
            grep -qE '^sha256:[0-9a-f]{64}$' "handoff/$img.digest" || { echo "::error::digest mancante o non valido per $img"; exit 1; }
            grep -q . "handoff/$img.tags" || { echo "::error::nessun tag da pubblicare per $img"; exit 1; }
            while IFS= read -r t; do
              [ -n "$t" ] || continue
              # Solo tag della stessa immagine (metadata-action li produce gia' completi).
              [[ "$t" == "$image:"* ]] || { echo "::error::tag inatteso per $img: $t"; exit 1; }
              # Pre-release: unico tag ammesso = il proprio (mai latest, X.Y, latest-YYYYMMDD).
              if [ "$PRERELEASE" = "true" ] && [ "$t" != "$image:${GITHUB_REF_NAME#v}" ]; then
                echo "::error::pre-release $GITHUB_REF_NAME: tag non ammesso $t"
                exit 1
              fi
            done < "handoff/$img.tags"
          done

          for phase in version dated latest; do
            for img in "${imgs[@]}"; do
              mapfile -t tags < <(tags_of "$img" "$phase")
              apply "ghcr.io/$ORG/govpay-interaction-layer-$img" "$(cat "handoff/$img.digest")" "${tags[@]}"
            done
          done

  # ── GitHub Release (Scorecard Signed-Releases): solo tag vX.Y.Z non pre-release ──
  # Dopo il publish: crea la Release se assente (note generate da GitHub) e allega per ogni
  # immagine SBOM CycloneDX (*.cdx.json) e bundle Sigstore della provenance (*.intoto.jsonl).
  # Release gia' creata a mano: solo gli asset (sovrascritti se la run viene rilanciata).
  release:
    needs: [setup, publish]
    if: needs.setup.outputs.skip != 'true' && startsWith(github.ref, 'refs/tags/v') && needs.setup.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # API GitHub + host di upload degli asset delle release.
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            uploads.github.com:443
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Crea release e allega asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for img in backoffice frontoffice db; do
            for f in "govpay-interaction-layer-$img.cdx.json" "govpay-interaction-layer-$img.intoto.jsonl"; do
              [ -s "release-assets/$f" ] || { echo "::error::asset mancante: $f"; exit 1; }
            done
          done
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG gia' presente: allego solo gli asset."
          else
            # Se nel frattempo l'ha creata qualcun altro, create fallisce e la view passa.
            gh release create "$TAG" -R "$REPO" --verify-tag --generate-notes --title "$TAG" \
              || gh release view "$TAG" -R "$REPO" >/dev/null
          fi
          gh release upload "$TAG" -R "$REPO" --clobber release-assets/*
          echo "::notice::Release $TAG: $(find release-assets -type f -printf '%f ')"

  # ── Rebuild automatico fallito: issue (latest resta la build precedente) ───
  # Tipico: vulnerabilità con fix non ancora nelle immagini base, host bloccato da
  # harden-runner, build rotto, firma/attestazione, smoke test, publish. Una sola issue aperta
  # alla volta, aggiornata a ogni fallimento.
  report-failure:
    needs: [setup, build-php-base, build-php, build-services, smoke, publish]
    # Anche sullo schedule: se setup fallisce prima di "mode", auto resta vuoto.
    if: failure() && (needs.setup.outputs.auto == 'true' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
      - name: Apri o aggiorna issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REASON: ${{ needs.setup.outputs.reason }}
        run: |
          set -euo pipefail
          title="Rebuild automatico di latest fallito"
          body=$(printf 'Run: %s\n\nCausa del rebuild: %s\n\n`latest` resta la build precedente. Controllare il log (Trivy, harden-runner "blocked", build).' "$RUN_URL" "${REASON:-n/d}")
          n=$(gh issue list -R "$REPO" --state open --search "in:title \"$title\"" --json number -q '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" -R "$REPO" --body "$body"
          else
            gh issue create -R "$REPO" --title "$title" --body "$body"
          fi
