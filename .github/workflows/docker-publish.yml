name: Docker Publish

on:
  push:
    tags: ['v*.*.*']
  # Push su "dev" NON triggera più direttamente: prima deve passare CI (ci.yml,
  # stesso push). Le due pipeline giravano scollegate — codice che rompe i test
  # poteva comunque finire buildato e pushato su ghcr con tag "dev" prima che
  # CI segnalasse il fallimento. workflow_run aspetta l'esito di CI sullo
  # stesso commit e pubblica solo se conclusion=='success' (vedi guardia sotto).
  # I tag (rilascio) restano un trigger diretto: un tag viene creato solo da un
  # commit già su main, già passato per PR+required check (v. branch protection).
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [dev]
  workflow_dispatch:

# Mai cancel-in-progress: un push a ghcr interrotto a meta' puo' lasciare un digest/manifest
# corrotto o incompleto — run concorrenti sullo stesso ref si accodano invece di accavallarsi.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  ORG: comune-di-montesilvano
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Resolve version once, share outputs to all matrix jobs ───────────────
  setup:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      version_type: ${{ steps.v.outputs.version_type }}
      version_label: ${{ steps.v.outputs.version_label }}
      ref_url: ${{ steps.v.outputs.ref_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Resolve version info
        id: v
        uses: ./.github/actions/version-resolver
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # ── Shared PHP base cache warmup ───────────────────────────────────────────
  # Build the common runtime-base layer once so backoffice/frontoffice reuse
  # the expensive asset_builder/vendor_builder/runtime-base graph.
  build-php-base:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build shared PHP base cache
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: runtime-base
          push: false
          provenance: false
          sbom: false
          build-args: |
            GIL_IMAGE_TAG=cache-warmup
            GIL_VERSION_TYPE=cache-warmup
            GIL_VERSION_LABEL=cache-warmup
            GIL_REF_URL=
            GIT_COMMIT_SHA=cache-warmup
          cache-from: |
            type=registry,ref=ghcr.io/${{ env.ORG }}/govpay-interaction-layer-php-common-cache:main
            type=gha,scope=php-common
            type=registry,ref=ghcr.io/${{ env.ORG }}/govpay-interaction-layer-backoffice:dev
            type=registry,ref=ghcr.io/${{ env.ORG }}/govpay-interaction-layer-frontoffice:dev
          cache-to: |
            type=registry,ref=ghcr.io/${{ env.ORG }}/govpay-interaction-layer-php-common-cache:main,mode=max
            type=gha,mode=max,scope=php-common

  # ── PHP apps: backoffice + frontoffice (parallel matrix) ─────────────────
  # Shared layers are warmed by build-php-base and then reused per app.
  build-php:
    needs: [setup]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: backoffice
            target: runtime-backoffice
            image_suffix: backoffice
            scope: backoffice
          - app: frontoffice
            target: runtime-frontoffice
            image_suffix: frontoffice
            scope: frontoffice
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Meta · ${{ matrix.app }}
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ env.ORG }}/govpay-interaction-layer-${{ matrix.image_suffix }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build & push · ${{ matrix.app }}
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Disabilitati per risparmiare tempo di esecuzione e spazio registry
          provenance: false
          sbom: false
          build-args: |
            GIL_IMAGE_TAG=${{ needs.setup.outputs.version }}
            GIL_VERSION_TYPE=${{ needs.setup.outputs.version_type }}
            GIL_VERSION_LABEL=${{ needs.setup.outputs.version_label }}
            GIL_REF_URL=${{ needs.setup.outputs.ref_url }}
            GIT_COMMIT_SHA=${{ github.sha }}
          cache-from: |
            type=registry,ref=ghcr.io/${{ env.ORG }}/govpay-interaction-layer-php-common-cache:main
            type=gha,scope=php-common
            type=gha,scope=${{ matrix.scope }}
            type=registry,ref=ghcr.io/${{ env.ORG }}/govpay-interaction-layer-${{ matrix.image_suffix }}-buildcache:main
            type=registry,ref=ghcr.io/${{ env.ORG }}/govpay-interaction-layer-${{ matrix.image_suffix }}:dev
          # mode=max protegge cache di composer e npm (stage intermedi); inline aggiunge
          # metadati cache nell'immagine per fallback registry su cache GHA evict
          cache-to: |
            type=registry,ref=ghcr.io/${{ env.ORG }}/govpay-interaction-layer-${{ matrix.image_suffix }}-buildcache:main,mode=max
            type=gha,mode=max,scope=${{ matrix.scope }}
            type=inline

      - name: Trivy scan · ${{ matrix.app }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ env.ORG }}/govpay-interaction-layer-${{ matrix.image_suffix }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.image_suffix }}.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
          limit-severities-for-sarif: true
          ignore-unfixed: true
          trivyignores: ${{ github.workspace }}/.trivyignore

      - name: Upload Trivy results · ${{ matrix.app }}
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        if: always()
        with:
          sarif_file: trivy-${{ matrix.image_suffix }}.sarif
          category: trivy-${{ matrix.image_suffix }}

  # ── Independent services: parallel matrix ─────────────────────────────────
  build-services:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: db
            context: docker
            file: docker/db/Dockerfile
            scope: db
            cache_mode: min

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Meta · ${{ matrix.image }}
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ env.ORG }}/govpay-interaction-layer-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build & push · ${{ matrix.image }}
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file || format('{0}/Dockerfile', matrix.context) }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Disabilitati per risparmiare tempo di esecuzione e spazio registry
          provenance: false
          sbom: false
          build-args: |
            GIL_IMAGE_TAG=${{ needs.setup.outputs.version }}
            GIL_VERSION_TYPE=${{ needs.setup.outputs.version_type }}
            GIL_VERSION_LABEL=${{ needs.setup.outputs.version_label }}
            GIL_REF_URL=${{ needs.setup.outputs.ref_url }}
            GIT_COMMIT_SHA=${{ github.sha }}
          cache-from: |
            type=gha,scope=${{ matrix.scope }}
            type=registry,ref=ghcr.io/${{ env.ORG }}/govpay-interaction-layer-${{ matrix.image }}-cache:main
          # GHA cache: max per layer costosi (pip/git/curl), min per immagini triviali
          # Registry fallback: sopravvive all'eviction GHA (10GB limit)
          cache-to: |
            type=gha,mode=${{ matrix.cache_mode }},scope=${{ matrix.scope }}
            type=registry,ref=ghcr.io/${{ env.ORG }}/govpay-interaction-layer-${{ matrix.image }}-cache:main,mode=max

      - name: Trivy scan · ${{ matrix.image }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ env.ORG }}/govpay-interaction-layer-${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
          limit-severities-for-sarif: true
          ignore-unfixed: true
          trivyignores: ${{ github.workspace }}/.trivyignore

      - name: Upload Trivy results · ${{ matrix.image }}
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        if: always()
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}
