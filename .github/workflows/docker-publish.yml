name: Docker Publish

on:
  # Rilascio: per convenzione un tag si crea solo su un commit già su main (PR+required check).
  # Il ruleset release-tags limita CHI crea tag (admin), non SU QUALE commit: la verifica di
  # origine arriva con la Fase 5 (D3).
  push:
    tags: ['v*.*.*']
  # Controllo giornaliero (04:30 UTC, dopo il giro dependabot delle 01:00 Europe/Rome):
  # `latest` (+ `latest-YYYYMMDD`) si ricostruisce SOLO se rebuild-check trova una causa reale
  # (commit su main, pacchetti di sistema aggiornabili, vulnerabilità HIGH/CRITICAL con fix
  # nell'immagine pubblicata — scripts/ci/rebuild-check.sh). Nessuna causa = nessun build e
  # nessun riavvio inutile delle istanze. I tag vX.Y.Z li crea solo il maintainer.
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      rebuild_latest:
        description: "Rebuild di latest da main senza rebuild-check (forzato)"
        type: boolean
        default: false
      dry_run:
        description: "Esegue solo il rebuild-check e ne stampa le cause, senza build (anche da branch)"
        type: boolean
        default: false

# Mai cancel-in-progress: un push a ghcr interrotto a meta' puo' lasciare un digest/manifest
# corrotto o incompleto — run concorrenti sullo stesso ref si accodano invece di accavallarsi.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Permessi minimi a livello di workflow, quelli di scrittura solo nei job che li usano.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  ORG: comune-di-montesilvano
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Resolve version + rebuild-check, outputs condivisi con i job di build ──
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Pull delle immagini latest per rebuild-check.
      packages: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      version_type: ${{ steps.v.outputs.version_type }}
      version_label: ${{ steps.v.outputs.version_label }}
      ref_url: ${{ steps.v.outputs.ref_url }}
      apt_refresh: ${{ steps.apt.outputs.apt_refresh }}
      build_date: ${{ steps.apt.outputs.build_date }}
      auto: ${{ steps.mode.outputs.auto }}
      skip: ${{ inputs.dry_run && 'true' || steps.mode.outputs.skip || steps.check.outputs.skip || 'false' }}
      reason: ${{ steps.check.outputs.reason || steps.mode.outputs.reason }}
      auto_tag: ${{ steps.mode.outputs.auto_tag }}
    steps:
      # Traffico in uscita limitato agli host elencati (anche dentro i container avviati dal
      # job). Gli endpoint dell'infrastruttura Actions sono consentiti dall'agent.
      # Run fallita per "blocked" → host nel log del post-step harden-runner o nella pagina
      # insights della run: aggiungerlo qui se legittimo.
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            *.githubapp.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            mirror.gcr.io:443
            check.trivy.dev:443
            deb.debian.org:80
            deb.debian.org:443
            archive.ubuntu.com:80
            security.ubuntu.com:80
            www.php.net:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Storia + tag completi: version-resolver ricava l'ultimo tag vX.Y.Z, rebuild-check
          # conta i commit dopo la revisione di latest.
          fetch-depth: 0
      - name: Resolve build mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          REBUILD_LATEST: ${{ inputs.rebuild_latest }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          auto=false
          skip=""
          reason=""
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            auto=true
          elif [[ "$REBUILD_LATEST" == "true" ]]; then
            # latest si costruisce solo da main: un dispatch da branch pubblicherebbe codice
            # non passato da PR.
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "::error::rebuild_latest solo da main (ref: $GITHUB_REF)"
              exit 1
            fi
            auto=true
            reason="rebuild forzato (workflow_dispatch)"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$DRY_RUN" != "true" ]]; then
            # Dispatch senza opzioni: nessun tag da produrre.
            skip=true
            echo "::notice::Nessuna opzione scelta: niente build (rebuild_latest o dry_run)."
          fi
          {
            echo "auto=$auto"
            echo "skip=$skip"
            echo "reason=$reason"
            echo "auto_tag=latest-$(date -u +%Y%m%d)"
          } >> "$GITHUB_OUTPUT"
      # Report Trivy delle immagini latest pubblicate, letti da rebuild-check. Mai bloccanti
      # qui: un'immagine assente o uno scan fallito diventano una causa di rebuild.
      - name: Prepara cartella report Trivy
        if: github.event_name == 'schedule' || inputs.dry_run
        run: mkdir -p trivy-latest
      - name: Trivy latest · backoffice
        if: github.event_name == 'schedule' || inputs.dry_run
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: ghcr.io/${{ env.ORG }}/govpay-interaction-layer-backoffice:latest
          format: json
          output: trivy-latest/backoffice.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 0
          trivyignores: ${{ github.workspace }}/.trivyignore
      - name: Trivy latest · frontoffice
        if: github.event_name == 'schedule' || inputs.dry_run
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: ghcr.io/${{ env.ORG }}/govpay-interaction-layer-frontoffice:latest
          format: json
          output: trivy-latest/frontoffice.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 0
          trivyignores: ${{ github.workspace }}/.trivyignore
      - name: Trivy latest · db
        if: github.event_name == 'schedule' || inputs.dry_run
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: ghcr.io/${{ env.ORG }}/govpay-interaction-layer-db:latest
          format: json
          output: trivy-latest/db.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 0
          trivyignores: ${{ github.workspace }}/.trivyignore
      - name: Rebuild-check
        id: check
        if: github.event_name == 'schedule' || inputs.dry_run
        env:
          ORG: ${{ env.ORG }}
          TRIVY_DIR: trivy-latest
          HEAD_SHA: ${{ github.sha }}
        run: scripts/ci/rebuild-check.sh
      - name: Resolve version info
        id: v
        uses: ./.github/actions/version-resolver
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          auto: ${{ steps.mode.outputs.auto }}
      # Data del giorno: invalida il layer apt di runtime-base a ogni build, altrimenti la cache
      # GHA/registry congela `apt-get upgrade` e le patch Debian non entrano mai.
      - name: Resolve apt refresh key
        id: apt
        run: |
          echo "apt_refresh=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

  # ── Shared PHP base cache warmup ───────────────────────────────────────────
  # Build the common runtime-base layer once so backoffice/frontoffice reuse
  # the expensive asset_builder/vendor_builder/runtime-base graph.
  build-php-base:
    needs: setup
    if: needs.setup.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      # Allowlist dei build: registry immagini base (Docker Hub), BuildKit, apt Debian, npm,
      # composer (packagist + dist GitHub), GHCR per la cache. Vedi commento nel job setup.
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            *.githubapp.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudfront.docker.com:443
            production.cloudflare.docker.com:443
            mirror.gcr.io:443
            registry.npmjs.org:443
            repo.packagist.org:443
            deb.debian.org:80
            deb.debian.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build shared PHP base cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: runtime-base
          push: false
          provenance: false
          sbom: false
          build-args: |
            GIL_IMAGE_TAG=cache-warmup
            GIL_VERSION_TYPE=cache-warmup
            GIL_VERSION_LABEL=cache-warmup
            GIL_REF_URL=
            GIT_COMMIT_SHA=cache-warmup
            APT_REFRESH=${{ needs.setup.outputs.apt_refresh }}
          cache-from: |
            type=registry,ref=ghcr.io/${{ env.ORG }}/govpay-interaction-layer-php-common-cache:main
            type=gha,scope=php-common
          cache-to: |
            type=registry,ref=ghcr.io/${{ env.ORG }}/govpay-interaction-layer-php-common-cache:main,mode=max
            type=gha,mode=max,scope=php-common

  # ── PHP apps: backoffice + frontoffice (parallel matrix) ─────────────────
  # Shared layers are warmed by build-php-base and then reused per app.
  build-php:
    needs: [setup]
    if: needs.setup.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: backoffice
            target: runtime-backoffice
            image_suffix: backoffice
            scope: backoffice
          - app: frontoffice
            target: runtime-frontoffice
            image_suffix: frontoffice
            scope: frontoffice
    steps:
      # Come build-php-base, piu' gli host di Trivy (DB vulnerabilità).
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            *.githubapp.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudfront.docker.com:443
            production.cloudflare.docker.com:443
            mirror.gcr.io:443
            registry.npmjs.org:443
            repo.packagist.org:443
            deb.debian.org:80
            deb.debian.org:443
            check.trivy.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Meta · ${{ matrix.app }}
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ env.ORG }}/govpay-interaction-layer-${{ matrix.image_suffix }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            gil.rebuild.reason=${{ needs.setup.outputs.reason }}
          # Rebuild automatico: nessun tag qui, l'immagine va su GHCR solo per digest e il job
          # promote applica latest + latest-YYYYMMDD dopo che TUTTE le immagini hanno passato
          # Trivy. (I tag di release vX.Y.Z taggano ancora prima dello scan: Fase 5, D3.)
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build & push · ${{ matrix.app }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: ${{ needs.setup.outputs.auto != 'true' }}
          tags: ${{ needs.setup.outputs.auto != 'true' && steps.meta.outputs.tags || '' }}
          outputs: ${{ needs.setup.outputs.auto == 'true' && format('type=image,name=ghcr.io/{0}/govpay-interaction-layer-{1},push-by-digest=true,name-canonical=true,push=true', env.ORG, matrix.image_suffix) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          # Disabilitati per risparmiare tempo di esecuzione e spazio registry
          provenance: false
          sbom: false
          build-args: |
            GIL_IMAGE_TAG=${{ needs.setup.outputs.version }}
            GIL_VERSION_TYPE=${{ needs.setup.outputs.version_type }}
            GIL_VERSION_LABEL=${{ needs.setup.outputs.version_label }}
            GIL_REF_URL=${{ needs.setup.outputs.ref_url }}
            GIT_COMMIT_SHA=${{ github.sha }}
            GIL_BUILD_DATE=${{ needs.setup.outputs.build_date }}
            APT_REFRESH=${{ needs.setup.outputs.apt_refresh }}
          cache-from: |
            type=registry,ref=ghcr.io/${{ env.ORG }}/govpay-interaction-layer-php-common-cache:main
            type=gha,scope=php-common
            type=gha,scope=${{ matrix.scope }}
            type=registry,ref=ghcr.io/${{ env.ORG }}/govpay-interaction-layer-${{ matrix.image_suffix }}-buildcache:main
          # mode=max protegge cache di composer e npm (stage intermedi); inline aggiunge
          # metadati cache nell'immagine per fallback registry su cache GHA evict
          cache-to: |
            type=registry,ref=ghcr.io/${{ env.ORG }}/govpay-interaction-layer-${{ matrix.image_suffix }}-buildcache:main,mode=max
            type=gha,mode=max,scope=${{ matrix.scope }}
            type=inline

      - name: Trivy scan · ${{ matrix.app }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: ghcr.io/${{ env.ORG }}/govpay-interaction-layer-${{ matrix.image_suffix }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.image_suffix }}.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
          limit-severities-for-sarif: true
          ignore-unfixed: true
          trivyignores: ${{ github.workspace }}/.trivyignore

      # Rebuild automatico: il digest passa a promote solo se Trivy (step prima) l'ha superato.
      - name: Salva digest · ${{ matrix.app }}
        if: needs.setup.outputs.auto == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: mkdir -p digests && printf '%s' "$DIGEST" > "digests/${{ matrix.image_suffix }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.setup.outputs.auto == 'true'
        with:
          name: digest-${{ matrix.image_suffix }}
          path: digests/${{ matrix.image_suffix }}
          retention-days: 1
          if-no-files-found: error

      - name: Upload Trivy results · ${{ matrix.app }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        if: always()
        with:
          sarif_file: trivy-${{ matrix.image_suffix }}.sarif
          category: trivy-${{ matrix.image_suffix }}

  # ── Independent services: parallel matrix ─────────────────────────────────
  build-services:
    needs: setup
    if: needs.setup.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: db
            context: docker
            file: docker/db/Dockerfile
            scope: db
            cache_mode: min

    steps:
      # Immagine db: base mariadb (Docker Hub), apt Ubuntu + repo mariadb (HTTP, pacchetti
      # firmati GPG), script init, piu' Trivy e GHCR.
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            *.githubapp.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudfront.docker.com:443
            production.cloudflare.docker.com:443
            mirror.gcr.io:443
            check.trivy.dev:443
            archive.ubuntu.com:80
            security.ubuntu.com:80
            archive.mariadb.org:80
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Meta · ${{ matrix.image }}
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ env.ORG }}/govpay-interaction-layer-${{ matrix.image }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            gil.rebuild.reason=${{ needs.setup.outputs.reason }}
          # Rebuild automatico: nessun tag qui, l'immagine va su GHCR solo per digest e il job
          # promote applica latest + latest-YYYYMMDD dopo che TUTTE le immagini hanno passato
          # Trivy. (I tag di release vX.Y.Z taggano ancora prima dello scan: Fase 5, D3.)
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build & push · ${{ matrix.image }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file || format('{0}/Dockerfile', matrix.context) }}
          push: ${{ needs.setup.outputs.auto != 'true' }}
          tags: ${{ needs.setup.outputs.auto != 'true' && steps.meta.outputs.tags || '' }}
          outputs: ${{ needs.setup.outputs.auto == 'true' && format('type=image,name=ghcr.io/{0}/govpay-interaction-layer-{1},push-by-digest=true,name-canonical=true,push=true', env.ORG, matrix.image) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          # Disabilitati per risparmiare tempo di esecuzione e spazio registry
          provenance: false
          sbom: false
          build-args: |
            GIL_IMAGE_TAG=${{ needs.setup.outputs.version }}
            GIL_VERSION_TYPE=${{ needs.setup.outputs.version_type }}
            GIL_VERSION_LABEL=${{ needs.setup.outputs.version_label }}
            GIL_REF_URL=${{ needs.setup.outputs.ref_url }}
            GIT_COMMIT_SHA=${{ github.sha }}
            GIL_BUILD_DATE=${{ needs.setup.outputs.build_date }}
            APT_REFRESH=${{ needs.setup.outputs.apt_refresh }}
          cache-from: |
            type=gha,scope=${{ matrix.scope }}
            type=registry,ref=ghcr.io/${{ env.ORG }}/govpay-interaction-layer-${{ matrix.image }}-cache:main
          # GHA cache: max per layer costosi (pip/git/curl), min per immagini triviali
          # Registry fallback: sopravvive all'eviction GHA (10GB limit)
          cache-to: |
            type=gha,mode=${{ matrix.cache_mode }},scope=${{ matrix.scope }}
            type=registry,ref=ghcr.io/${{ env.ORG }}/govpay-interaction-layer-${{ matrix.image }}-cache:main,mode=max

      - name: Trivy scan · ${{ matrix.image }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: ghcr.io/${{ env.ORG }}/govpay-interaction-layer-${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
          limit-severities-for-sarif: true
          ignore-unfixed: true
          trivyignores: ${{ github.workspace }}/.trivyignore

      # Rebuild automatico: il digest passa a promote solo se Trivy (step prima) l'ha superato.
      - name: Salva digest · ${{ matrix.image }}
        if: needs.setup.outputs.auto == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: mkdir -p digests && printf '%s' "$DIGEST" > "digests/${{ matrix.image }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.setup.outputs.auto == 'true'
        with:
          name: digest-${{ matrix.image }}
          path: digests/${{ matrix.image }}
          retention-days: 1
          if-no-files-found: error

      - name: Upload Trivy results · ${{ matrix.image }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        if: always()
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

  # ── Rebuild automatico: latest + latest-YYYYMMDD su tutte le immagini insieme ─
  # Gira solo se OGNI build e scan Trivy è passato: mai un latest misto tra revisioni
  # (frontoffice usa le API /api/frontoffice/* del backoffice della stessa revisione).
  promote:
    needs: [setup, build-php, build-services]
    if: needs.setup.outputs.auto == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Niente setup-buildx: imagetools create lavora solo sul registry.
      - name: Tagga latest
        env:
          ORG: ${{ env.ORG }}
          AUTO_TAG: ${{ needs.setup.outputs.auto_tag }}
        run: |
          set -euo pipefail
          for img in backoffice frontoffice db; do
            [ -s "digests/$img" ] || { echo "::error::digest mancante per $img"; exit 1; }
          done
          for img in backoffice frontoffice db; do
            image="ghcr.io/$ORG/govpay-interaction-layer-$img"
            docker buildx imagetools create -t "$image:latest" -t "$image:$AUTO_TAG" "$image@$(cat "digests/$img")"
          done

  # ── Rebuild automatico fallito: issue (latest resta la build precedente) ───
  # Tipico: vulnerabilità con fix non ancora nelle immagini base, host bloccato da
  # harden-runner, build rotto. Una sola issue aperta alla volta, aggiornata a ogni fallimento.
  report-failure:
    needs: [setup, build-php-base, build-php, build-services, promote]
    # Anche sullo schedule: se setup fallisce prima di "mode", auto resta vuoto.
    if: failure() && (needs.setup.outputs.auto == 'true' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
      - name: Apri o aggiorna issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REASON: ${{ needs.setup.outputs.reason }}
        run: |
          set -euo pipefail
          title="Rebuild automatico di latest fallito"
          body=$(printf 'Run: %s\n\nCausa del rebuild: %s\n\n`latest` resta la build precedente. Controllare il log (Trivy, harden-runner "blocked", build).' "$RUN_URL" "${REASON:-n/d}")
          n=$(gh issue list -R "$REPO" --state open --search "in:title \"$title\"" --json number -q '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" -R "$REPO" --body "$body"
          else
            gh issue create -R "$REPO" --title "$title" --body "$body"
          fi
