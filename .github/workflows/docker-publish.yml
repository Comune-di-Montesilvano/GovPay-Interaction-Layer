name: Docker Publish

on:
  push:
    tags: ['v*.*.*']
  # Push su "dev" NON triggera più direttamente: prima deve passare CI (ci.yml,
  # stesso push). Le due pipeline giravano scollegate — codice che rompe i test
  # poteva comunque finire buildato e pushato su ghcr con tag "dev" prima che
  # CI segnalasse il fallimento. workflow_run aspetta l'esito di CI sullo
  # stesso commit e pubblica solo se conclusion=='success' (vedi guardia sotto).
  # I tag (rilascio) restano un trigger diretto: un tag viene creato solo da un
  # commit già su main, già passato per PR+required check (v. branch protection).
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [dev]
  # Rebuild settimanale di main (lunedi' 04:30 UTC): aggiorna SOLO `latest` (+ `latest-YYYYMMDD`)
  # con immagini base/patch Debian fresche, senza toccare i tag vX.Y.Z (quelli li crea solo
  # il maintainer). Saltato se nell'ultima settimana e' gia' stato pubblicato un tag.
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:
    inputs:
      rebuild_latest:
        description: "Rebuild automatico di latest (come lo schedule settimanale, senza skip)"
        type: boolean
        default: false

# Mai cancel-in-progress: un push a ghcr interrotto a meta' puo' lasciare un digest/manifest
# corrotto o incompleto — run concorrenti sullo stesso ref si accodano invece di accavallarsi.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  security-events: write
  actions: read

env:
  REGISTRY: ghcr.io
  ORG: comune-di-montesilvano
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Resolve version once, share outputs to all matrix jobs ───────────────
  setup:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      version_type: ${{ steps.v.outputs.version_type }}
      version_label: ${{ steps.v.outputs.version_label }}
      ref_url: ${{ steps.v.outputs.ref_url }}
      apt_refresh: ${{ steps.apt.outputs.apt_refresh }}
      build_date: ${{ steps.apt.outputs.build_date }}
      auto: ${{ steps.mode.outputs.auto }}
      skip: ${{ steps.mode.outputs.skip }}
      auto_tag: ${{ steps.mode.outputs.auto_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          # Storia + tag completi: il rebuild automatico ricava l'ultimo tag vX.Y.Z.
          fetch-depth: 0
      - name: Resolve build mode
        id: mode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REBUILD_LATEST: ${{ inputs.rebuild_latest }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          auto=false
          skip=false
          if [[ "$EVENT_NAME" == "schedule" || "$REBUILD_LATEST" == "true" ]]; then
            auto=true
          fi
          # Solo lo schedule salta: un tag pubblicato negli ultimi 7 giorni ha gia' rinfrescato
          # latest. Le run "push" di questo workflow sono solo tag (i branch passano da workflow_run).
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            since=$(date -u -d '7 days ago' +%F)
            recent=$(gh run list -R "$REPO" --workflow docker-publish.yml --event push \
              --status success --created ">=$since" --json headBranch -q 'length')
            if [[ "$recent" -gt 0 ]]; then
              echo "::notice::Tag pubblicato negli ultimi 7 giorni: rebuild settimanale saltato."
              skip=true
            fi
          fi
          {
            echo "auto=$auto"
            echo "skip=$skip"
            echo "auto_tag=latest-$(date -u +%Y%m%d)"
          } >> "$GITHUB_OUTPUT"
      - name: Resolve version info
        id: v
        uses: ./.github/actions/version-resolver
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          auto: ${{ steps.mode.outputs.auto }}
      # Settimana ISO: invalida il layer apt di runtime-base una volta a settimana, altrimenti
      # la cache GHA/registry congela `apt-get upgrade` e le patch Debian non entrano mai.
      - name: Resolve apt refresh key
        id: apt
        run: |
          echo "apt_refresh=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

  # ── Shared PHP base cache warmup ───────────────────────────────────────────
  # Build the common runtime-base layer once so backoffice/frontoffice reuse
  # the expensive asset_builder/vendor_builder/runtime-base graph.
  build-php-base:
    needs: setup
    if: needs.setup.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build shared PHP base cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: runtime-base
          push: false
          provenance: false
          sbom: false
          build-args: |
            GIL_IMAGE_TAG=cache-warmup
            GIL_VERSION_TYPE=cache-warmup
            GIL_VERSION_LABEL=cache-warmup
            GIL_REF_URL=
            GIT_COMMIT_SHA=cache-warmup
            APT_REFRESH=${{ needs.setup.outputs.apt_refresh }}
          cache-from: |
            type=registry,ref=ghcr.io/${{ env.ORG }}/govpay-interaction-layer-php-common-cache:main
            type=gha,scope=php-common
            type=registry,ref=ghcr.io/${{ env.ORG }}/govpay-interaction-layer-backoffice:dev
            type=registry,ref=ghcr.io/${{ env.ORG }}/govpay-interaction-layer-frontoffice:dev
          cache-to: |
            type=registry,ref=ghcr.io/${{ env.ORG }}/govpay-interaction-layer-php-common-cache:main,mode=max
            type=gha,mode=max,scope=php-common

  # ── PHP apps: backoffice + frontoffice (parallel matrix) ─────────────────
  # Shared layers are warmed by build-php-base and then reused per app.
  build-php:
    needs: [setup]
    if: needs.setup.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: backoffice
            target: runtime-backoffice
            image_suffix: backoffice
            scope: backoffice
          - app: frontoffice
            target: runtime-frontoffice
            image_suffix: frontoffice
            scope: frontoffice
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Meta · ${{ matrix.app }}
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ env.ORG }}/govpay-interaction-layer-${{ matrix.image_suffix }}
          tags: |
            type=ref,event=branch,enable=${{ needs.setup.outputs.auto != 'true' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ needs.setup.outputs.auto_tag }},enable=${{ needs.setup.outputs.auto == 'true' }}

      - name: Build & push · ${{ matrix.app }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Disabilitati per risparmiare tempo di esecuzione e spazio registry
          provenance: false
          sbom: false
          build-args: |
            GIL_IMAGE_TAG=${{ needs.setup.outputs.version }}
            GIL_VERSION_TYPE=${{ needs.setup.outputs.version_type }}
            GIL_VERSION_LABEL=${{ needs.setup.outputs.version_label }}
            GIL_REF_URL=${{ needs.setup.outputs.ref_url }}
            GIT_COMMIT_SHA=${{ github.sha }}
            GIL_BUILD_DATE=${{ needs.setup.outputs.build_date }}
            APT_REFRESH=${{ needs.setup.outputs.apt_refresh }}
          cache-from: |
            type=registry,ref=ghcr.io/${{ env.ORG }}/govpay-interaction-layer-php-common-cache:main
            type=gha,scope=php-common
            type=gha,scope=${{ matrix.scope }}
            type=registry,ref=ghcr.io/${{ env.ORG }}/govpay-interaction-layer-${{ matrix.image_suffix }}-buildcache:main
            type=registry,ref=ghcr.io/${{ env.ORG }}/govpay-interaction-layer-${{ matrix.image_suffix }}:dev
          # mode=max protegge cache di composer e npm (stage intermedi); inline aggiunge
          # metadati cache nell'immagine per fallback registry su cache GHA evict
          cache-to: |
            type=registry,ref=ghcr.io/${{ env.ORG }}/govpay-interaction-layer-${{ matrix.image_suffix }}-buildcache:main,mode=max
            type=gha,mode=max,scope=${{ matrix.scope }}
            type=inline

      - name: Trivy scan · ${{ matrix.app }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: ghcr.io/${{ env.ORG }}/govpay-interaction-layer-${{ matrix.image_suffix }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.image_suffix }}.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
          limit-severities-for-sarif: true
          ignore-unfixed: true
          trivyignores: ${{ github.workspace }}/.trivyignore

      # Rebuild automatico: `latest` punta al nuovo digest solo DOPO che Trivy l'ha passato
      # (se lo scan fallisce il job si ferma prima e latest resta la build precedente).
      - name: Promuovi latest · ${{ matrix.app }}
        if: needs.setup.outputs.auto == 'true'
        env:
          IMAGE: ghcr.io/${{ env.ORG }}/govpay-interaction-layer-${{ matrix.image_suffix }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE@$DIGEST"

      - name: Upload Trivy results · ${{ matrix.app }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        if: always()
        with:
          sarif_file: trivy-${{ matrix.image_suffix }}.sarif
          category: trivy-${{ matrix.image_suffix }}

  # ── Independent services: parallel matrix ─────────────────────────────────
  build-services:
    needs: setup
    if: needs.setup.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: db
            context: docker
            file: docker/db/Dockerfile
            scope: db
            cache_mode: min

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Meta · ${{ matrix.image }}
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ env.ORG }}/govpay-interaction-layer-${{ matrix.image }}
          tags: |
            type=ref,event=branch,enable=${{ needs.setup.outputs.auto != 'true' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ needs.setup.outputs.auto_tag }},enable=${{ needs.setup.outputs.auto == 'true' }}

      - name: Build & push · ${{ matrix.image }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file || format('{0}/Dockerfile', matrix.context) }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Disabilitati per risparmiare tempo di esecuzione e spazio registry
          provenance: false
          sbom: false
          build-args: |
            GIL_IMAGE_TAG=${{ needs.setup.outputs.version }}
            GIL_VERSION_TYPE=${{ needs.setup.outputs.version_type }}
            GIL_VERSION_LABEL=${{ needs.setup.outputs.version_label }}
            GIL_REF_URL=${{ needs.setup.outputs.ref_url }}
            GIT_COMMIT_SHA=${{ github.sha }}
            GIL_BUILD_DATE=${{ needs.setup.outputs.build_date }}
          cache-from: |
            type=gha,scope=${{ matrix.scope }}
            type=registry,ref=ghcr.io/${{ env.ORG }}/govpay-interaction-layer-${{ matrix.image }}-cache:main
          # GHA cache: max per layer costosi (pip/git/curl), min per immagini triviali
          # Registry fallback: sopravvive all'eviction GHA (10GB limit)
          cache-to: |
            type=gha,mode=${{ matrix.cache_mode }},scope=${{ matrix.scope }}
            type=registry,ref=ghcr.io/${{ env.ORG }}/govpay-interaction-layer-${{ matrix.image }}-cache:main,mode=max

      - name: Trivy scan · ${{ matrix.image }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: ghcr.io/${{ env.ORG }}/govpay-interaction-layer-${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
          limit-severities-for-sarif: true
          ignore-unfixed: true
          trivyignores: ${{ github.workspace }}/.trivyignore

      # Rebuild automatico: `latest` punta al nuovo digest solo DOPO che Trivy l'ha passato
      # (se lo scan fallisce il job si ferma prima e latest resta la build precedente).
      - name: Promuovi latest · ${{ matrix.image }}
        if: needs.setup.outputs.auto == 'true'
        env:
          IMAGE: ghcr.io/${{ env.ORG }}/govpay-interaction-layer-${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE@$DIGEST"

      - name: Upload Trivy results · ${{ matrix.image }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        if: always()
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}
