name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:

# Cancella run precedenti sullo stesso ref quando arriva un nuovo push (retry rapido,
# fixup successivi sulla stessa PR) — evita di sprecare minuti runner su un risultato
# che verra' comunque scartato.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7


      - name: Debug struttura client generati
        run: |
          ls -lR govpay-clients/generated-clients/backoffice-v1 || true

      - name: Crea file .env per il CI
        run: |
          cat > .env <<'EOF'
          DB_ROOT_PASSWORD=rootsecret
          DB_NAME=appdb
          DB_USER=appuser
          DB_PASSWORD=apppass
          EOF


      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_mysql, intl, zip
          coverage: xdebug

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Composer audit (known vulnerable deps)
        run: composer audit --no-dev

      - name: PHPStan (static analysis, baseline su debito esistente)
        run: vendor/bin/phpstan analyse --memory-limit=1G

      - name: Cache DB image
        id: db-image-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/docker-cache
          key: docker-db-${{ hashFiles('docker/db/Dockerfile', 'docker/db-init/**') }}
          restore-keys: docker-db-

      - name: Load or pull DB image
        env:
          DB_IMAGE: ghcr.io/comune-di-montesilvano/govpay-interaction-layer-db:latest
        run: |
          if [ -f /tmp/docker-cache/db.tar ]; then
            docker load -i /tmp/docker-cache/db.tar
          else
            docker pull "$DB_IMAGE"
            mkdir -p /tmp/docker-cache
            docker save "$DB_IMAGE" -o /tmp/docker-cache/db.tar
          fi

      - name: Avvia servizi con Docker Compose
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d db

      - name: Run tests
        run: vendor/bin/phpunit --coverage-text

      - name: Ferma i container
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down

  trivy-fs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Trivy filesystem scan (vuln + secrets + misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs-results.sarif
          severity: CRITICAL,HIGH
          # Bloccante (coerente con docker-publish.yml): un secret/misconfig/vuln
          # CRITICAL-HIGH nel sorgente non deve passare silenziosamente.
          exit-code: 1
          ignore-unfixed: true
          limit-severities-for-sarif: true
          trivyignores: ${{ github.workspace }}/.trivyignore

      - name: Upload Trivy results to GH Security tab
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        if: always()
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs
