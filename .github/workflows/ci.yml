name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  # Merge queue: i required check girano sul commit temporaneo della coda prima del merge.
  merge_group:
  # Giro giornaliero su main (05:00 UTC): nuovi advisory su dipendenze invariate
  # (composer audit in build-test, Trivy fs).
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

# Cancella run precedenti sullo stesso ref quando arriva un nuovo push (retry rapido,
# fixup successivi sulla stessa PR) — evita di sprecare minuti runner su un risultato
# che verra' comunque scartato.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  build-test:
    # Solo in merge queue, giornaliero e dispatch: PR leggere (sulla PR gira il segnaposto
    # build-test-placeholder con lo stesso nome). Non su push a main: gia' passato in coda (il
    # merge e' il commit testato). Unit, gruppo db, PHPStan e composer audit si scoprono quindi
    # in coda: verificare in locale prima del push (vendor/bin/phpunit, PHPStan).
    if: github.event_name != 'push' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DIFF: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
    steps:
      # Traffico in uscita registrato (audit, non bloccato): host contattati nel log del
      # post-step e nella pagina insights StepSecurity della run.
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Base della PR/coda in .base: composer.lock della base e gate differenziale della base.
      # Rimossa subito dopo l'audit (PHPStan/PHPUnit non devono vederla).
      - name: Checkout base
        if: env.DIFF == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.BASE_SHA }}
          path: .base
          persist-credentials: false
          sparse-checkout: |
            composer.json
            composer.lock
            scripts/security
          sparse-checkout-cone-mode: false

      # Script di sicurezza/CI (scripts/security, scripts/ci): test node:test e bash su copie
      # fisse in scripts/security/test/fixtures, mai sui file vivi del repo. Node del runner, nessuna dipendenza.
      - name: Test script di sicurezza
        run: |
          node --test scripts/security/test/*.test.mjs

      # Dependabot aggiorna solo il FROM composer del Dockerfile: senza questo controllo la
      # versione di setup-php resta indietro in silenzio (successo: 2.10.3 contro 2.11.1).
      - name: Composer CI allineato al Dockerfile
        run: |
          set -euo pipefail
          docker=$(sed -nE 's/^FROM composer:([0-9]+\.[0-9]+\.[0-9]+)@sha256:[0-9a-f]{64} AS vendor_builder.*/\1/p' Dockerfile)
          ci=$(sed -nE 's/^ +tools: composer:([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' .github/actions/php-deps/action.yml)
          [ -n "$docker" ] && [ -n "$ci" ] || { echo "::error::versione composer non trovata (Dockerfile '$docker', php-deps '$ci')"; exit 1; }
          [ "$docker" = "$ci" ] || { echo "::error file=.github/actions/php-deps/action.yml::tools: composer:$ci diverso dal Dockerfile (composer:$docker): allineare a mano"; exit 1; }
          echo "composer $ci"

      - uses: ./.github/actions/php-deps
        with:
          coverage: xdebug

      - name: Composer validate (composer.json valido e coerente)
        run: composer validate --no-check-publish --no-check-all

      # Assoluto su schedule/dispatch: stato reale di main, nuovi advisory su dipendenze invariate.
      - name: Composer audit (known vulnerable deps)
        if: env.DIFF != 'true'
        run: composer audit --no-dev

      # Su PR e merge queue il gate e' DIFFERENZIALE (come ComunicaPA): fallisce solo per
      # advisory/abbandonati assenti dalla base (stesso run, stesso DB packagist). Un advisory
      # pubblicato dopo il merge non blocca le PR non correlate ne' quelle che lo correggono:
      # lo stato assoluto di main lo controlla il giro giornaliero. Exit di composer audit
      # ignorato (≠0 con qualsiasi advisory): decide diff-gate, exit 2 su JSON non valido.
      - name: Composer audit differenziale (nuovi rispetto alla base)
        if: env.DIFF == 'true'
        run: |
          composer audit --no-dev --locked --format=json > "$RUNNER_TEMP/head.json" || true
          composer audit --no-dev --locked --format=json -d .base > "$RUNNER_TEMP/base.json" || true
          # Gate dalla base quando esiste: una PR non puo' indebolire il gate che la giudica.
          GATE=.base/scripts/security/diff-gate.mjs; [ -f "$GATE" ] || GATE=scripts/security/diff-gate.mjs
          node "$GATE" --format composer --head "$RUNNER_TEMP/head.json" --base "$RUNNER_TEMP/base.json"

      - name: Rimuovi checkout base
        if: always() && env.DIFF == 'true'
        run: rm -rf .base

      - name: PHPStan (static analysis, baseline su debito esistente)
        run: vendor/bin/phpstan analyse --memory-limit=1G

      - uses: ./.github/actions/test-db

      - name: Run tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3307"
          DB_NAME: appdb
          DB_USER: appuser
          DB_PASSWORD: apppass
        # Copertura informativa, senza soglie: testo nel log, HTML + Clover come artifact.
        # Gruppo integration escluso: gira nel job integration-tests (stessa coda, in parallelo).
        run: vendor/bin/phpunit --exclude-group integration --coverage-text --coverage-html coverage/html --coverage-clover coverage/clover.xml

      # Copertura delle righe PHP modificate (solo in coda): >= 70% delle righe misurate dal
      # clover rispetto a merge_group.base_sha, altrimenti build-test fallisce. Il clover misura
      # solo app/ (<source> di phpunit.xml) e senza il gruppo integration: file fuori dal report
      # (backoffice/src, controller coperti solo dai test di integrazione) sono ignorati, non
      # contati come scoperti. Nessuna riga misurata nel diff → passa.
      - name: Copertura righe modificate (diff-cover)
        if: github.event_name == 'merge_group'
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet --depth=50 origin "$BASE_SHA"
          python3 -m venv "$RUNNER_TEMP/diffcover"
          "$RUNNER_TEMP/diffcover/bin/pip" install --quiet --require-hashes -r scripts/ci/requirements-diffcover.txt
          rc=0
          "$RUNNER_TEMP/diffcover/bin/diff-cover" coverage/clover.xml             --compare-branch="$BASE_SHA" --diff-range-notation=.. --fail-under=70             --include 'app/**' --markdown-report coverage/diff.md || rc=$?
          cat coverage/diff.md >> "$GITHUB_STEP_SUMMARY"
          [ "$rc" = 0 ] || echo "::error::copertura delle righe PHP modificate sotto il 70% (dettaglio nel summary)"
          exit "$rc"

      # Solo in coda (come ComunicaPA): il commit che verra' unito. Sulle PR basta il log.
      - name: Upload report di copertura
        if: ${{ !cancelled() && github.event_name == 'merge_group' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/
          retention-days: 7
          if-no-files-found: warn

      - name: Ferma i container
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down

  # Test di integrazione (gruppo PHPUnit `integration`, tests/Integration): backoffice Slim
  # in-process su MariaDB usa-e-getta con GovPay/pagoPA finto (tests/Fakes/GovPay, avviato dal
  # test con php -S). Come build-test solo in coda, giornaliero e dispatch; sulla PR il
  # segnaposto integration-tests-placeholder. Nessun `needs`: lo schema `!cancelled()` di
  # ComunicaPA (job saltato per dipendenza fallita = verde) qui non serve.
  integration-tests:
    if: github.event_name != 'push' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/php-deps
      - uses: ./.github/actions/test-db
      - name: Test di integrazione
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3307"
          DB_NAME: appdb
          DB_USER: appuser
          DB_PASSWORD: apppass
        run: vendor/bin/phpunit --group integration
      - name: Ferma i container
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down

  integration-tests-placeholder:
    name: integration-tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "integration-tests reale in merge queue (ci.yml, job integration-tests)"

  # Segnaposto sulla PR del required check build-test (reale solo in coda, vedi sopra): stesso
  # schema del job placeholder di image-check.yml. Niente harden-runner: un job con soli step
  # banali e harden-runner puo' restare appeso fino al timeout.
  build-test-placeholder:
    name: build-test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "build-test reale in merge queue (ci.yml, job build-test)"

  # Dipendenze aggiunte o aggiornate dalla PR con advisory high/critical, devDependencies e
  # Actions comprese (composer audit e Trivy vedono solo produzione e immagini). Solo sulle PR:
  # in merge queue e su push il job risulta saltato, che per un required check vale verde.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Traffico in uscita registrato (audit, non bloccato): host contattati nel log del
      # post-step e nella pagina insights StepSecurity della run.
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      # Niente checkout: sulle pull_request l'action confronta base e head via API (dependency
      # graph); il workspace servirebbe solo per un config-file locale, che non usiamo.
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development

  # Alert CodeQL nuovi della PR: aspetta il check "CodeQL" (default setup) sul commit della PR e
  # ne riporta l'esito (scripts/ci/codeql-gate.sh). Il check CodeQL stesso non puo' essere
  # required (non gira in merge_group); questo job si', come dependency-review: saltato in coda.
  codeql-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: Attendi il check CodeQL
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci/codeql-gate.sh "$REPO" "$SHA"

  trivy-fs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    env:
      DIFF: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      # Stessa cache dell'action (default di trivy-action): gli step `trivy` successivi
      # riusano il DB scaricato con --skip-db-update.
      TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
    steps:
      # Traffico in uscita registrato (audit, non bloccato): host contattati nel log del
      # post-step e nella pagina insights StepSecurity della run.
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Fuori dalla cartella scansionata (Trivy salta .base, vedi skip-dirs).
      - name: Checkout base
        if: env.DIFF == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.BASE_SHA }}
          path: .base
          persist-credentials: false

      # SARIF sempre caricato. Bloccante (vuln compresi) su push/schedule; su PR e merge queue
      # decidono i due step successivi (come ComunicaPA).
      - name: Trivy filesystem scan (vuln + secrets + misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          skip-dirs: .base,.cache
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs-results.sarif
          severity: CRITICAL,HIGH
          exit-code: ${{ env.DIFF == 'true' && '0' || '1' }}
          ignore-unfixed: true
          limit-severities-for-sarif: true
          trivyignores: ${{ github.workspace }}/.trivyignore.yaml

      # Segreti e misconfig nascono da modifiche al repo, non da advisory esterni: assoluti.
      - name: Trivy secret + misconfig (assoluto)
        if: env.DIFF == 'true'
        run: |
          trivy fs --quiet --skip-db-update --skip-dirs .base,.cache --scanners secret,misconfig \
            --severity CRITICAL,HIGH --ignorefile .trivyignore.yaml --exit-code 1 .

      # Stesso binario e stesso DB (gia' scaricato dallo step SARIF) per testa e base.
      - name: Trivy vuln differenziale (nuove rispetto alla base)
        if: env.DIFF == 'true'
        run: |
          opts=(fs --quiet --skip-db-update --scanners vuln --severity "CRITICAL,HIGH"
            --ignore-unfixed --ignorefile "$GITHUB_WORKSPACE/.trivyignore.yaml" --format json)
          trivy "${opts[@]}" --skip-dirs .base,.cache --output "$RUNNER_TEMP/head.json" .
          trivy "${opts[@]}" --output "$RUNNER_TEMP/base.json" .base
          # Gate dalla base quando esiste: una PR non puo' indebolire il gate che la giudica.
          GATE=.base/scripts/security/diff-gate.mjs; [ -f "$GATE" ] || GATE=scripts/security/diff-gate.mjs
          node "$GATE" --format trivy --head "$RUNNER_TEMP/head.json" --base "$RUNNER_TEMP/base.json"

      - name: Upload Trivy results to GH Security tab
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        if: always()
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs
