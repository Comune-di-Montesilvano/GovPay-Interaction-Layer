name: Cleanup Packages

# Manutenzione manuale: elimina versioni obsolete dei package GHCR del progetto.
# Protegge sempre i tag latest/dev e le versioni >= alla soglia minor indicata.
on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Nome package GHCR (es. govpay-interaction-layer-backoffice)'
        required: true
        type: string
      keep_regex:
        description: 'Regex tag da conservare (oltre a untagged escluso a priori)'
        required: false
        default: '^(1\.5\.|1\.5$|latest|dev)'
        type: string

permissions:
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old package versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ inputs.package_name }}
          package-type: 'container'
          org: 'comune-di-montesilvano'
          min-versions-to-keep: 0
          ignore-versions: ${{ inputs.keep_regex }}
