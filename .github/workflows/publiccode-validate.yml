name: publiccode.yml validation
on:
  push:
    branches: ["main"]
    paths: ["publiccode.yml"]
  pull_request:
    paths: ["publiccode.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publiccode-validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  publiccode_yml_validation:
    runs-on: ubuntu-latest
    name: publiccode.yml validation
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Traffico in uscita registrato (audit, non bloccato): host contattati nel log del
      # post-step e nella pagina insights StepSecurity della run.
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate publiccode.yml
        uses: italia/publiccode-parser-action@f370d239aa3ec57b819909b467ff77679b6dc721 # v1
        with:
          publiccode: publiccode.yml
          comment-on-pr: ${{ github.event_name == 'pull_request' }}
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
