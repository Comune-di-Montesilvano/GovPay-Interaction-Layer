name: publiccode.yml validation
on:
  push:
    branches: ["main"]
    paths: ["publiccode.yml"]
  pull_request:
    paths: ["publiccode.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: publiccode-validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  publiccode_yml_validation:
    runs-on: ubuntu-latest
    name: publiccode.yml validation
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate publiccode.yml
        uses: italia/publiccode-parser-action@0deab88c3f094aa12c5826e52ac2c4f176446821 # v1
        with:
          publiccode: publiccode.yml
          comment-on-pr: ${{ github.event_name == 'pull_request' }}
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
