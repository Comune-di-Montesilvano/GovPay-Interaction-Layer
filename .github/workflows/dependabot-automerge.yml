name: Dependabot auto-merge
# Minor/patch di dependabot: auto-merge (GitHub, squash: unico metodo ammesso dal repo). Con la
# merge queue attiva `gh pr merge --auto` accoda la PR appena i required check sono verdi; la
# coda testa ogni PR sul tip aggiornato di main, quindi non serve piu' aggiornare i branch behind.
# Major: nessuna azione, la PR resta aperta come promemoria per l'upgrade manuale.
# Eccezione: cambio di tag immagine php/mariadb (es. php 8.5 -> 8.6, mariadb 12.3 -> 12.4) —
# dependabot li classifica minor ma sono upgrade di runtime/DB, restano manuali come le major.
# Il solo cambio di digest sullo stesso tag (es. php 8.5.x ripubblicato con un fix CVE) va invece
# in auto-merge: e' la patch di sicurezza che il rebuild-check deve portare in latest.
#
# Token GitHub App (secret GIL_BOT_CLIENT_ID / GIL_BOT_PRIVATE_KEY) invece di GITHUB_TOKEN:
# le azioni di merge fatte con GITHUB_TOKEN non triggerano altri workflow (CI sul merge). Sul trigger pull_request di dependabot sono
# visibili solo i secret Dependabot: i due secret vanno salvati sia come Actions che come
# Dependabot secret.
# Permessi App (repo): Contents RW, Pull requests RW, Workflows RW (le PR github-actions
# toccano .github/workflows/), Metadata R.
on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  enable-automerge:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Traffico in uscita registrato (audit, non bloccato): host contattati nel log del
      # post-step e nella pagina insights StepSecurity della run.
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Token GitHub App
        id: app
        if: >-
          steps.meta.outputs.update-type != 'version-update:semver-major' &&
          !(steps.meta.outputs.package-ecosystem == 'docker' &&
            steps.meta.outputs.previous-version != steps.meta.outputs.new-version &&
            (contains(steps.meta.outputs.dependency-names, 'php') ||
             contains(steps.meta.outputs.dependency-names, 'mariadb')))
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.GIL_BOT_CLIENT_ID }}
          private-key: ${{ secrets.GIL_BOT_PRIVATE_KEY }}

      - name: Abilita auto-merge
        if: steps.app.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"

      - name: Major/runtime lasciata manuale
        if: steps.app.outcome == 'skipped'
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          DEPS: ${{ steps.meta.outputs.dependency-names }}
        run: |
          echo "::notice::Nessun auto-merge (${UPDATE_TYPE}, ${DEPS}) - PR lasciata aperta per revisione manuale."
