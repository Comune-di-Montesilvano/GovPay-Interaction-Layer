name: Semgrep

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  schedule:
    - cron: '0 5 * * 1'  # lunedi 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/php \
            --config p/owasp-top-ten \
            --config p/security-audit \
            --config p/secrets \
            --sarif --output=semgrep.sarif \
            --error || true

      - name: Upload SARIF to GH Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
