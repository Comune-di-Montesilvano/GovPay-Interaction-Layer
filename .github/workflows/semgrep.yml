name: Semgrep

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Merge queue: scan diff-aware sul commit della coda, bloccante come sulle PR.
  merge_group:
  schedule:
    - cron: '0 5 * * *'  # ogni giorno 05:00 UTC: nuove regole su codice invariato
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    # Versione e digest fissati: aggiornati a mano su issue di toolchain-version-check.yml.
    container:
      image: semgrep/semgrep:1.181.0@sha256:81474464c1f07483ba0682a44787fd93c91397419762a04abe2bafaae396304b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # --exclude-rule: 2 regole del motore "generic" (non capisce la sintassi Twig, opera per
      # pattern testuali) verificate a mano come rumore puro su questo repo (2026-09-06) — zero
      # match genuini in tutto il codebase (grep su tutti i template: nessun attributo HTML
      # realmente non quotato, nessun href costruito senza escaping — Twig autoescape e' sempre
      # attivo, mai disabilitato, ogni {{ var }} in un attributo e' dentro virgolette). Le regole
      # scattavano su testo dentro tag <span>/<div> scambiato per attributi dal motore generic.
      - name: Run Semgrep (diff-aware, bloccante) · pull_request/merge_group
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          # PR: base della PR; merge queue: base_sha del gruppo (tip di main all'accodamento).
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          semgrep scan \
            --config p/php \
            --config p/owasp-top-ten \
            --config p/security-audit \
            --config p/secrets \
            --exclude-rule generic.html-templates.security.unquoted-attribute-var.unquoted-attribute-var \
            --exclude-rule generic.html-templates.security.var-in-href.var-in-href \
            --baseline-commit "$BASE_SHA" \
            --sarif --output=semgrep.sarif \
            --error

      - name: Run Semgrep (scan completo, report-only) · push/schedule
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        run: |
          semgrep scan \
            --config p/php \
            --config p/owasp-top-ten \
            --config p/security-audit \
            --config p/secrets \
            --exclude-rule generic.html-templates.security.unquoted-attribute-var.unquoted-attribute-var \
            --exclude-rule generic.html-templates.security.var-in-href.var-in-href \
            --sarif --output=semgrep.sarif

      - name: Upload SARIF to GH Security tab
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
