version: 2
# Controllo giornaliero alle 01:00 (come ComunicaPA): l'auto-merge delle minor/patch finisce prima
# del rebuild-check delle 04:30 UTC (docker-publish.yml), che ricostruisce latest solo se c'e' una
# causa reale (es. un merge dependabot). Il cooldown non si applica ai security update: le
# correzioni di advisory arrivano subito. Ecosistema docker-compose non usato: docker-compose.yml
# referenzia solo immagini GIL (${APP_VERSION}), nessuna immagine di terzi da aggiornare.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "01:00"
      timezone: "Europe/Rome"
    # Attende N giorni dalla pubblicazione prima di proporre l'update — mitiga il rischio di
    # una release appena pubblicata compromessa/malevola (supply-chain), piu' margine sui major.
    cooldown:
      default-days: 7
    # Minor+patch in una sola PR per ecosistema (merge automatico, vedi
    # dependabot-automerge.yml); le major restano PR singole, aperte come promemoria.
    groups:
      minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "daily"
      time: "01:00"
      timezone: "Europe/Rome"
    # Attende N giorni dalla pubblicazione prima di proporre l'update — mitiga il rischio di
    # una release appena pubblicata compromessa/malevola (supply-chain), piu' margine sui major.
    cooldown:
      default-days: 7
      semver-major-days: 14
    # Minor+patch in una sola PR per ecosistema (merge automatico, vedi
    # dependabot-automerge.yml); le major restano PR singole, aperte come promemoria.
    groups:
      minor-patch:
        update-types: ["minor", "patch"]
    # Questi package sono client locali risolti via repository type=path in composer.json.
    # Dependabot non puo aggiornarli via registry remota.
    ignore:
      - dependency-name: "govpay/backoffice-client"
      - dependency-name: "govpay/pagamenti-client"
      - dependency-name: "govpay/pendenze-client"
      - dependency-name: "govpay/ragioneria-client"
      - dependency-name: "pagopa/gpd-client"
      - dependency-name: "pagopa/checkout-ec-client"
      - dependency-name: "pagopa/biz-events-client"

  # Immagini base FROM nei Dockerfile (root: node/composer/php multi-stage; docker/db: mariadb)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
      time: "01:00"
      timezone: "Europe/Rome"
    # Attende N giorni dalla pubblicazione prima di proporre l'update — mitiga il rischio di
    # una release appena pubblicata compromessa/malevola (supply-chain), piu' margine sui major.
    cooldown:
      default-days: 7
    # Minor+patch in una sola PR per ecosistema (merge automatico, vedi
    # dependabot-automerge.yml); le major restano PR singole, aperte come promemoria.
    groups:
      minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/docker/db"
    schedule:
      interval: "daily"
      time: "01:00"
      timezone: "Europe/Rome"
    # Attende N giorni dalla pubblicazione prima di proporre l'update — mitiga il rischio di
    # una release appena pubblicata compromessa/malevola (supply-chain), piu' margine sui major.
    cooldown:
      default-days: 7
    # Minor+patch in una sola PR per ecosistema (merge automatico, vedi
    # dependabot-automerge.yml); le major restano PR singole, aperte come promemoria.
    groups:
      minor-patch:
        update-types: ["minor", "patch"]
    # Restiamo su 12.3 LTS: 13.0 e' rolling (EOL community Q4 2026). Rimuovere quando
    # una 13.x diventa LTS.
    ignore:
      - dependency-name: "mariadb"
        versions: [">= 13.0, < 13.1"]

  # Librerie frontend (Font Awesome, Chart.js, litepicker, tom-select): package.json root,
  # installate nello stage asset_builder del Dockerfile e servite da /assets.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "01:00"
      timezone: "Europe/Rome"
    cooldown:
      default-days: 7
      semver-major-days: 14
    # Minor+patch in una sola PR per ecosistema (merge automatico, vedi
    # dependabot-automerge.yml); le major restano PR singole, aperte come promemoria.
    groups:
      minor-patch:
        update-types: ["minor", "patch"]
