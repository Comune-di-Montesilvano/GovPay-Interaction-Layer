# Stack e2e: override di docker-compose.yml (mai docker-compose.override.yml) per e2e/run.sh,
# progetto compose dedicato (default gil-e2e). Le immagini GIL arrivano da E2E_IMAGES_FILE
# (digest firmati del run in docker-publish.yml). Dipendenze esterne finte:
#   fake-govpay  GovPay/pagoPA con stato (tests/Fakes/GovPay), route non gestite → prism
#   prism        mock dalle spec OpenAPI vendorizzate di GovPay Backoffice
#   mailpit      SMTP finto + API REST per leggere le mail
#   oidc         IdP OIDC finto, path pa-sso-proxy /OIDC/* (tests/Fakes/Oidc)
#   playwright   runner (profilo `runner`, avviato con `run --rm`)
# Nessuna porta pubblicata: tutto passa dalla rete govpay-network. Worker mai avviato.
# Path relativi alla directory del PRIMO file -f (root del repo), non a e2e/.
# Immagini di terze parti fissate tag@digest (aggiornamento: toolchain-version-check per
# Playwright, a mano per le altre).
services:
  backoffice:
    ports: !reset []
    container_name: gil-e2e-backoffice
  frontoffice:
    ports: !reset []
    container_name: gil-e2e-frontoffice
    # Config letta dal backoffice a ogni richiesta: i cambi da Impostazioni (es. login OIDC nel
    # flusso 04) valgono subito, senza aspettare la cache di 300 s.
    environment:
      - FRONTOFFICE_CONFIG_CACHE_TTL=0
  db:
    container_name: gil-e2e-db

  fake-govpay:
    image: php:8.5-cli-trixie@sha256:f324fcb4dc009ac0470a7d614cd122499dcee3ca47a9bab620fc14c0eb759ba2
    command: ["php", "-S", "0.0.0.0:8080", "/fakes/router.php"]
    working_dir: /fakes
    user: "33:33"
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    environment:
      # php -S serve una richiesta alla volta: con piu' worker una richiesta lenta (es. inoltro a
      # Prism) non blocca le altre. Lo stato e' su file sotto flock (FakeState), sicuro in parallelo.
      - PHP_CLI_SERVER_WORKERS=4
      - PRISM_URL=http://prism:4010
      - FAKE_GOVPAY_STATE=/tmp/fake-govpay.json
    volumes:
      - ./tests/Fakes/GovPay:/fakes:ro
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      - govpay-network

  oidc:
    image: php:8.5-cli-trixie@sha256:f324fcb4dc009ac0470a7d614cd122499dcee3ca47a9bab620fc14c0eb759ba2
    command: ["php", "-S", "0.0.0.0:8080", "/oidc/router.php"]
    working_dir: /oidc
    user: "33:33"
    read_only: true
    volumes:
      - ./tests/Fakes/Oidc:/oidc:ro
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      - govpay-network

  prism:
    image: stoplight/prism:5.15.10@sha256:586d1f0f94f8d0eaf20b26b8b41f985f2a2d494bea297bd3988c3de3eb87094e
    # -m false: la modalita' multiprocesso (default) di Prism 5.15 termina all'avvio con
    # "Cannot read properties of undefined (reading 'isPrimary')". 00-health verifica che risponda.
    command: ["mock", "-m", "false", "-h", "0.0.0.0", "-p", "4010", "/specs/backoffice.bundled.yaml"]
    volumes:
      - ./govpay-clients/generated-clients/backoffice-v1:/specs:ro
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      - govpay-network

  mailpit:
    image: axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      - govpay-network

  playwright:
    image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
    profiles: ["runner"]
    working_dir: /e2e
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npx playwright test"]
    environment:
      - CI=${CI:-}
      - E2E_UPGRADE=${E2E_UPGRADE:-}
      - "E2E_ADMIN_PASSWORD=${E2E_ADMIN_PASSWORD:?E2E_ADMIN_PASSWORD obbligatoria: avviare con e2e/run.sh}"
    ipc: host
    volumes:
      - ./e2e:/e2e
      # node_modules del container, mai quelli dell'host (Windows/macOS diversi da Linux).
      - e2e_node_modules:/e2e/node_modules
    networks:
      - govpay-network

  # OWASP ZAP baseline (solo scansione passiva + spider, nessun attacco attivo) contro frontoffice e
  # login backoffice, solo con E2E_ZAP=1 (e2e/run.sh). Report in e2e/zap-report, report-only.
  # -silent: nessuna richiesta di ZAP verso internet (aggiornamenti, call home).
  zap:
    image: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
    profiles: ["zap"]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    volumes:
      - ./e2e/zap-report:/zap/wrk
    networks:
      - govpay-network

  # Test di carico (load/scenari.js) solo con E2E_LOAD=1 (e2e/run.sh). Target: solo i servizi di
  # questa rete (mai la produzione). Riepilogo in e2e/load-report/summary.json.
  k6:
    image: grafana/k6:2.4.0@sha256:d41bb79cd8de5a7ad619b53570e3712633e8bff0937010a5c6c57a4747e7a276
    profiles: ["load"]
    working_dir: /load
    environment:
      - LOAD_VUS=${LOAD_VUS:-10}
      - LOAD_DURATION=${LOAD_DURATION:-2m}
      - K6_NO_USAGE_REPORT=true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    volumes:
      - ./load:/load:ro
      - ./e2e/load-report:/load-report
    networks:
      - govpay-network

volumes:
  e2e_node_modules:
