# Override per sviluppo locale — caricato automaticamente da docker compose.
# NON usare in produzione. Aggiunge mount live per debug e sviluppo.
services:
  backoffice:
    build:
      context: .
      target: runtime-backoffice
    volumes:
      - ./debug:/var/www/html/public/debug

  frontoffice:
    build:
      context: .
      target: runtime-frontoffice
    volumes:
      - ./debug:/var/www/html/public/debug

  # Il worker NON parte in locale con `docker compose up`: esegue i lavori periodici (GovPay,
  # ponte rendicontazione GERI/DILAZIONE, App IO, pendenze massive) con i settings presenti nel
  # DB, che in locale e' spesso un dump di produzione. Avvio esplicito, solo su un DB non di
  # produzione:  docker compose --profile worker up -d --build worker
  worker:
    profiles: ["worker"]
    build:
      context: .
      target: runtime-backoffice

  db:
    build:
      context: ./docker
      dockerfile: db/Dockerfile
